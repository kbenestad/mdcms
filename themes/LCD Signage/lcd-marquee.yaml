# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — lcd · marquee
# Broadway marquee bulbs after dark: golden-yellow headlines glowing over
# crisp white body copy. Daylight mode swaps the bulbs for a sunlit
# cream-and-gold ticket booth.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#B8860B"
    surface: "#FFF6DC"
    page: "#FFFDF6"
    ink: "#1D1810"
    ink-muted: "#7A6F58"
  dark:
    primary: "#FFD400"
    surface: "#151008"
    page: "#0B0804"
    ink: "#FFFFFF"
    ink-muted: "#C7C2B8"
    on-surface: "#F5F1E6"
    on-surface-active: "#FFD400"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "rgba(255,255,255,0.55)"
    on-surface-note: "rgba(255,255,255,0.55)"
    on-surface-icon: "rgba(255,255,255,0.55)"

# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#3B82F6"
  warning: "#F59E0B"
  success: "#22C55E"
  error: "#EF4444"

colours-semantic-dark:
  info: "#60A5FA"
  warning: "#FBBF24"
  success: "#4ADE80"
  error: "#F87171"

# ──────────────────────────────────
# Callout defaults
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#3B82F6"
    background-colour: "#3B82F6"
  warning:
    icon: warning
    primary-colour: "#F59E0B"
    background-colour: "#F59E0B"
  success:
    icon: success
    primary-colour: "#22C55E"
    background-colour: "#22C55E"
  error:
    icon: error
    primary-colour: "#EF4444"
    background-colour: "#EF4444"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# Bitcount Grid Double gives headings a segmented LCD-digit look; IBM
# Plex Mono keeps body copy readable at paragraph length. `heading` is
# left unset — headings inherit `primary` (the marquee yellow) by design.
# ──────────────────────────────────
font-body: "bunny:IBM Plex Mono:400"
font-heading: "google:Bitcount Grid Double:400"
font-size: 1.05        # unitless multiplier (1.0 = 16px base)
line-height: 1.65      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 78em
nav-width: 20em
