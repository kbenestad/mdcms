# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — lcd · ticker
# A departures-board LED ticker: every character running the same warm
# amber-yellow, headline and body alike. Daylight mode is the same board
# read as sun-faded parchment instead of lit segments.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#8A6D1B"
    surface: "#FBF3D9"
    page: "#FFFCF2"
    ink: "#3A2F0E"
    ink-muted: "#8A7F5E"
  dark:
    primary: "#FFEB3B"
    surface: "#151200"
    page: "#0A0800"
    ink: "#FFD54A"
    ink-muted: "#B59B2E"
    on-surface: "#FFE9A6"
    on-surface-active: "#FFEB3B"
    on-surface-title: "#FFF4C2"
    on-surface-heading: "rgba(255,235,59,0.55)"
    on-surface-note: "rgba(255,235,59,0.55)"
    on-surface-icon: "rgba(255,235,59,0.55)"

# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#2E86DE"
  warning: "#E67E22"
  success: "#27AE60"
  error: "#E74C3C"

colours-semantic-dark:
  info: "#74B9FF"
  warning: "#FFB84D"
  success: "#6FCF97"
  error: "#FF6B6B"

# ──────────────────────────────────
# Callout defaults
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#2E86DE"
    background-colour: "#2E86DE"
  warning:
    icon: warning
    primary-colour: "#E67E22"
    background-colour: "#E67E22"
  success:
    icon: success
    primary-colour: "#27AE60"
    background-colour: "#27AE60"
  error:
    icon: error
    primary-colour: "#E74C3C"
    background-colour: "#E74C3C"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# Bitcount's segmented-grid glyphs for both body and heading — the whole
# board is one font, since a real LED ticker doesn't switch typefaces
# between the headline and the scrolling text underneath it.
# ──────────────────────────────────
font-body: "google:Bitcount Grid Single:400"
font-heading: "google:Bitcount Grid Double:400"
font-size: 1.15        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 78em
nav-width: 20em
