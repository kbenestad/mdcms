# mdcms theme v0.6.0
# mdcms theme — festal
# Cream and gold. Christmas, Easter, and the great festivals.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#B58A1A"
    surface: "#F3E9B8"
    page: "#FBF8E8"
    ink: "#2A2410"
    ink-muted: "#6E6440"
    on-surface: "#2A2410"
    on-surface-active: "#7F6112"
    on-surface-title: "#2A2410"
    on-surface-heading: "#6E6440"
    on-surface-note: "#6E6440"
    on-surface-icon: "#6E6440"
  dark:
    primary: "#E5C04A"
    surface: "#1F1A0F"
    page: "#14110A"
    ink: "#F4ECD0"
    ink-muted: "#A89A78"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#2B5797"
  warning: "#B58A1A"
  success: "#2F7A4A"
  error: "#9C3A2A"

colours-semantic-dark:
  info: "#80A5DB"
  warning: "#EBC970"
  success: "#89D2A3"
  error: "#DC8C7E"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#2B5797"
    background-colour: "#2B5797"
  warning:
    icon: warning
    primary-colour: "#B58A1A"
    background-colour: "#B58A1A"
  success:
    icon: success
    primary-colour: "#2F7A4A"
    background-colour: "#2F7A4A"
  error:
    icon: error
    primary-colour: "#9C3A2A"
    background-colour: "#9C3A2A"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:Cormorant Garamond:500"
font-heading: "bunny:Cormorant Garamond:700"
font-size: 1.05        # unitless multiplier (1.0 = 16px base)
line-height: 1.60      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
