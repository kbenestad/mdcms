# mdcms theme v0.6.0
# mdcms theme — sarum
# Deep Sarum blue. Advent in the English Use — vigilant, contemplative.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#1B3666"
    surface: "#E2E8F1"
    page: "#FFFFFF"
    ink: "#14213D"
    ink-muted: "#5C667A"
  dark:
    primary: "#8FA8D8"
    surface: "#131A30"
    page: "#0A1024"
    ink: "#ECEDF4"
    ink-muted: "#9498B5"
    on-surface: "#E2E2E2"
    on-surface-active: "#8FA8D8"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "#9A9A9A"
    on-surface-note: "#9A9A9A"
    on-surface-icon: "#9A9A9A"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#1B3666"
  warning: "#B26A1F"
  success: "#2F7A4A"
  error: "#9C3A2A"

colours-semantic-dark:
  info: "#7EA0DD"
  warning: "#E7AF74"
  success: "#89D2A3"
  error: "#DC8C7E"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#1B3666"
    background-colour: "#1B3666"
  warning:
    icon: warning
    primary-colour: "#B26A1F"
    background-colour: "#B26A1F"
  success:
    icon: success
    primary-colour: "#2F7A4A"
    background-colour: "#2F7A4A"
  error:
    icon: error
    primary-colour: "#9C3A2A"
    background-colour: "#9C3A2A"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:Cormorant Garamond:500"
font-heading: "bunny:Cormorant Garamond:700"
font-size: 1.05        # unitless multiplier (1.0 = 16px base)
line-height: 1.60      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
