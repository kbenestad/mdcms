# mdcms theme v0.6.0
# mdcms theme — requiem · bold
# Silver thread on black. Solemn mourning vestments.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#9C9C9C"
    surface: "#1A1A1A"
    page: "#FFFFFF"
    ink: "#1A1A1A"
    ink-muted: "#5C5C5C"
    on-surface: "#E2E2E2"
    on-surface-active: "#9C9C9C"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "#9A9A9A"
    on-surface-note: "#9A9A9A"
    on-surface-icon: "#9A9A9A"
  dark:
    primary: "#C9C9C9"
    surface: "#000000"
    page: "#050505"
    ink: "#FFFFFF"
    ink-muted: "#9C9C9C"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#1B3666"
  warning: "#B58A1A"
  success: "#14532D"
  error: "#B91C1C"

colours-semantic-dark:
  info: "#7EA0DD"
  warning: "#EBC970"
  success: "#7BDFA3"
  error: "#EA7171"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#1B3666"
    background-colour: "#1B3666"
  warning:
    icon: warning
    primary-colour: "#B58A1A"
    background-colour: "#B58A1A"
  success:
    icon: success
    primary-colour: "#14532D"
    background-colour: "#14532D"
  error:
    icon: error
    primary-colour: "#B91C1C"
    background-colour: "#B91C1C"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:Cormorant Garamond:500"
font-heading: "bunny:Cormorant Garamond:700"
font-size: 1.05        # unitless multiplier (1.0 = 16px base)
line-height: 1.60      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
