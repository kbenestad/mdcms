# mdcms theme v0.6.0
# mdcms theme — requiem
# Parchment and black. All Souls, funerals, mourning.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#1A1A1A"
    surface: "#1A1A1A"
    page: "#FAF6EE"
    ink: "#1A1A1A"
    ink-muted: "#6E665A"
    on-surface: "#E2E2E2"
    on-surface-active: "#FFFFFF"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "#9A9A9A"
    on-surface-note: "#9A9A9A"
    on-surface-icon: "#9A9A9A"
  dark:
    primary: "#F4ECD8"
    surface: "#000000"
    page: "#050505"
    ink: "#F4ECD8"
    ink-muted: "#9F9A8A"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#1A1A1A"
  warning: "#B26A1F"
  success: "#2F7A4A"
  error: "#9C3A2A"

colours-semantic-dark:
  info: "#D28989"
  warning: "#E7AF74"
  success: "#89D2A3"
  error: "#DC8C7E"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#1A1A1A"
    background-colour: "#1A1A1A"
  warning:
    icon: warning
    primary-colour: "#B26A1F"
    background-colour: "#B26A1F"
  success:
    icon: success
    primary-colour: "#2F7A4A"
    background-colour: "#2F7A4A"
  error:
    icon: error
    primary-colour: "#9C3A2A"
    background-colour: "#9C3A2A"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:Cormorant Garamond:500"
font-heading: "bunny:Cormorant Garamond:700"
font-size: 1.05        # unitless multiplier (1.0 = 16px base)
line-height: 1.60      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
