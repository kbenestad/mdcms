# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — ordinary · bold
# Gold on verdant green. The long banner of Ordinary Time, woven through.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#C9A23E"
    surface: "#14532D"
    page: "#FFFFFF"
    ink: "#0A2A18"
    ink-muted: "#4A6E58"
    on-surface: "rgba(255,255,255,0.92)"
    on-surface-active: "#C9A23E"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "rgba(255,255,255,0.65)"
    on-surface-note: "rgba(255,255,255,0.70)"
    on-surface-icon: "rgba(255,255,255,0.70)"
  dark:
    primary: "#E5C04A"
    surface: "#0F2A1A"
    page: "#08140C"
    ink: "#FFFFFF"
    ink-muted: "#9DC8A8"
    on-surface: "#E2E2E2"
    on-surface-active: "#E5C04A"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "#9A9A9A"
    on-surface-note: "#9A9A9A"
    on-surface-icon: "#9A9A9A"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#1B3666"
  warning: "#B58A1A"
  success: "#14532D"
  error: "#B91C1C"

colours-semantic-dark:
  info: "#7EA0DD"
  warning: "#EBC970"
  success: "#7BDFA3"
  error: "#EA7171"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#1B3666"
    background-colour: "#1B3666"
  warning:
    icon: warning
    primary-colour: "#B58A1A"
    background-colour: "#B58A1A"
  success:
    icon: success
    primary-colour: "#14532D"
    background-colour: "#14532D"
  error:
    icon: error
    primary-colour: "#B91C1C"
    background-colour: "#B91C1C"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:Cormorant Garamond:500"
font-heading: "bunny:Cormorant Garamond:700"
font-size: 1.05        # unitless multiplier (1.0 = 16px base)
line-height: 1.60      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
