# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — coffee · espresso
# Dark roast. Rich espresso brown on warm cream — strongest of the three.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#3D1E0F"
    surface: "#3D1E0F"
    page: "#FAF2E2"
    ink: "#2A1810"
    ink-muted: "#6E5640"
    on-surface: "#E2E2E2"
    on-surface-active: "#FFFFFF"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "#9A9A9A"
    on-surface-note: "#9A9A9A"
    on-surface-icon: "#9A9A9A"
  dark:
    primary: "#C99060"
    surface: "#000000"
    page: "#140A05"
    ink: "#F0E0CC"
    ink-muted: "#A88068"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#3D1E0F"
  warning: "#B26A1F"
  success: "#3F6B3C"
  error: "#9C3A2A"

colours-semantic-dark:
  info: "#DF9C7C"
  warning: "#E7AF74"
  success: "#8DD289"
  error: "#DC8C7E"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#3D1E0F"
    background-colour: "#3D1E0F"
  warning:
    icon: warning
    primary-colour: "#B26A1F"
    background-colour: "#B26A1F"
  success:
    icon: success
    primary-colour: "#3F6B3C"
    background-colour: "#3F6B3C"
  error:
    icon: error
    primary-colour: "#9C3A2A"
    background-colour: "#9C3A2A"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:Newsreader:400"
font-heading: "bunny:Newsreader:600"
font-size: 1.05        # unitless multiplier (1.0 = 16px base)
line-height: 1.65      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
