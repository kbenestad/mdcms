# mdcms theme v0.6.0
# mdcms theme — gray · mono
# Pure black on white. Maximum restraint — no chrome, no tint.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#000000"
    surface: "#FFFFFF"
    page: "#FFFFFF"
    ink: "#000000"
    ink-muted: "#737380"
  dark:
    primary: "#FFFFFF"
    surface: "#000000"
    page: "#000000"
    ink: "#FFFFFF"
    ink-muted: "#8A8A92"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#1F2937"
  warning: "#1F2937"
  success: "#1F2937"
  error: "#1F2937"

colours-semantic-dark:
  info: "#89A7D2"
  warning: "#89A7D2"
  success: "#89A7D2"
  error: "#89A7D2"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#1F2937"
    background-colour: "#1F2937"
  warning:
    icon: warning
    primary-colour: "#1F2937"
    background-colour: "#1F2937"
  success:
    icon: success
    primary-colour: "#1F2937"
    background-colour: "#1F2937"
  error:
    icon: error
    primary-colour: "#1F2937"
    background-colour: "#1F2937"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:IBM Plex Sans:300"
font-heading: "bunny:IBM Plex Sans:600"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
