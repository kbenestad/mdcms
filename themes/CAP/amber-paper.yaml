# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — amber · paper
# White paper, neutral chrome. Amber as a confident highlight.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#F9AD18"
    surface: "#F5F4F0"
    page: "#FFFFFF"
    ink: "#1A1814"
    ink-muted: "#5C5A52"
    on-surface: "#1A1814"
    on-surface-active: "#1A1A1A"
    on-surface-title: "#1A1814"
    on-surface-heading: "#5C5A52"
    on-surface-note: "#5C5A52"
    on-surface-icon: "#5C5A52"
  dark:
    primary: "#FFC04A"
    surface: "#1A1712"
    page: "#0F0D0A"
    ink: "#F2EFE8"
    ink-muted: "#A39E92"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#2B5797"
  warning: "#F9AD18"
  success: "#2F7A4A"
  error: "#C13030"

colours-semantic-dark:
  info: "#80A5DB"
  warning: "#F9AD18"
  success: "#89D2A3"
  error: "#DE7C7C"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#2B5797"
    background-colour: "#2B5797"
  warning:
    icon: warning
    primary-colour: "#F9AD18"
    background-colour: "#F9AD18"
  success:
    icon: success
    primary-colour: "#2F7A4A"
    background-colour: "#2F7A4A"
  error:
    icon: error
    primary-colour: "#C13030"
    background-colour: "#C13030"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:IBM Plex Sans:300"
font-heading: "bunny:IBM Plex Sans:600"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
