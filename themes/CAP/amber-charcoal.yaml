# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — amber · charcoal
# White content with a charcoal nav sidebar. Amber pops on dark.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#F9AD18"
    surface: "#1A1814"
    page: "#FFFFFF"
    ink: "#161412"
    ink-muted: "#5C5A52"
    on-surface: "#E2E2E2"
    on-surface-active: "#F9AD18"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "#9A9A9A"
    on-surface-note: "#9A9A9A"
    on-surface-icon: "#9A9A9A"
  dark:
    primary: "#FFB72E"
    surface: "#000000"
    page: "#0A0907"
    ink: "#F2EFE8"
    ink-muted: "#9C9890"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#3B73C4"
  warning: "#F9AD18"
  success: "#2F8A5A"
  error: "#D04040"

colours-semantic-dark:
  info: "#82A5D9"
  warning: "#F9AD18"
  success: "#85D6AB"
  error: "#DF7C7C"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#3B73C4"
    background-colour: "#3B73C4"
  warning:
    icon: warning
    primary-colour: "#F9AD18"
    background-colour: "#F9AD18"
  success:
    icon: success
    primary-colour: "#2F8A5A"
    background-colour: "#2F8A5A"
  error:
    icon: error
    primary-colour: "#D04040"
    background-colour: "#D04040"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:IBM Plex Sans:300"
font-heading: "bunny:IBM Plex Sans:600"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
