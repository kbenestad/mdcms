# mdcms theme v0.6.0
# mdcms theme — indigo · monochrome
# Blue-tinted neutrals throughout. Calm, monochromatic, brand-forward.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#29307D"
    surface: "#E7EAF4"
    page: "#F7F8FC"
    ink: "#1A1E3A"
    ink-muted: "#5F6585"
  dark:
    primary: "#A5ABE6"
    surface: "#141833"
    page: "#0A0D1F"
    ink: "#E6E8F4"
    ink-muted: "#8A8FB0"
    on-surface: "#E2E2E2"
    on-surface-active: "#A5ABE6"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "#9A9A9A"
    on-surface-note: "#9A9A9A"
    on-surface-icon: "#9A9A9A"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#29307D"
  warning: "#C77A12"
  success: "#0E8A5F"
  error: "#D63F4A"

colours-semantic-dark:
  info: "#848BD7"
  warning: "#F1B869"
  success: "#6BF0C2"
  error: "#E27980"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#29307D"
    background-colour: "#29307D"
  warning:
    icon: warning
    primary-colour: "#C77A12"
    background-colour: "#C77A12"
  success:
    icon: success
    primary-colour: "#0E8A5F"
    background-colour: "#0E8A5F"
  error:
    icon: error
    primary-colour: "#D63F4A"
    background-colour: "#D63F4A"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:IBM Plex Sans:300"
font-heading: "bunny:IBM Plex Sans:600"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
