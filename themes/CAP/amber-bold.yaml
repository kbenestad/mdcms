# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — amber · bold
# Amber as the whole sidebar. Dark text on yellow — BVG energy, dialled into a brand system.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#1A1814"
    surface: "#F9AD18"
    page: "#FFFFFF"
    ink: "#1A1814"
    ink-muted: "#5C5A52"
    on-surface: "rgba(0,0,0,0.85)"
    on-surface-active: "#1A1814"
    on-surface-title: "#000000"
    on-surface-heading: "rgba(0,0,0,0.60)"
    on-surface-note: "rgba(0,0,0,0.65)"
    on-surface-icon: "rgba(0,0,0,0.65)"
  dark:
    primary: "#FFC85A"
    surface: "#3F2F08"
    page: "#0F0D0A"
    ink: "#FFFFFF"
    ink-muted: "#C9B580"
    on-surface: "rgba(255,255,255,0.92)"
    on-surface-active: "#FFC85A"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "rgba(255,255,255,0.65)"
    on-surface-note: "rgba(255,255,255,0.70)"
    on-surface-icon: "rgba(255,255,255,0.70)"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#2B5797"
  warning: "#D88A0C"
  success: "#2F7A4A"
  error: "#C13030"

colours-semantic-dark:
  info: "#80A5DB"
  warning: "#F6BF64"
  success: "#89D2A3"
  error: "#DE7C7C"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#2B5797"
    background-colour: "#2B5797"
  warning:
    icon: warning
    primary-colour: "#D88A0C"
    background-colour: "#D88A0C"
  success:
    icon: success
    primary-colour: "#2F7A4A"
    background-colour: "#2F7A4A"
  error:
    icon: error
    primary-colour: "#C13030"
    background-colour: "#C13030"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:IBM Plex Sans:300"
font-heading: "bunny:IBM Plex Sans:600"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
