# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — indigo · bold
# Indigo as the sidebar itself. Gold accent for content links — institutional and confident.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#C9A23E"
    surface: "#29307D"
    page: "#FFFFFF"
    ink: "#15172B"
    ink-muted: "#5C6079"
    on-surface: "rgba(255,255,255,0.92)"
    on-surface-active: "#C9A23E"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "rgba(255,255,255,0.65)"
    on-surface-note: "rgba(255,255,255,0.70)"
    on-surface-icon: "rgba(255,255,255,0.70)"
  dark:
    primary: "#E5C04A"
    surface: "#1A1F4F"
    page: "#0C0E1C"
    ink: "#FFFFFF"
    ink-muted: "#B0B8E0"
    on-surface: "rgba(255,255,255,0.92)"
    on-surface-active: "#E5C04A"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "rgba(255,255,255,0.65)"
    on-surface-note: "rgba(255,255,255,0.70)"
    on-surface-icon: "rgba(255,255,255,0.70)"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#29307D"
  warning: "#B58A1A"
  success: "#2F7A4A"
  error: "#B91C1C"

colours-semantic-dark:
  info: "#848BD7"
  warning: "#EBC970"
  success: "#89D2A3"
  error: "#EA7171"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#29307D"
    background-colour: "#29307D"
  warning:
    icon: warning
    primary-colour: "#B58A1A"
    background-colour: "#B58A1A"
  success:
    icon: success
    primary-colour: "#2F7A4A"
    background-colour: "#2F7A4A"
  error:
    icon: error
    primary-colour: "#B91C1C"
    background-colour: "#B91C1C"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:IBM Plex Sans:300"
font-heading: "bunny:IBM Plex Sans:600"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
