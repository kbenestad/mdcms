# mdcms theme v0.6.0
# mdcms theme — press · ibm plex
# Monochrome editorial "press" look (see mono · press) set in IBM Plex Sans. IBM Plex Sans, IBM's open-source corporate typeface.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#1F3A6B"
    surface: "#FAFAFA"
    page: "#FFFFFF"
    ink: "#000000"
    ink-muted: "#6B6B6B"
  dark:
    primary: "#8AB0E8"
    surface: "#000000"
    page: "#000000"
    ink: "#F2F2F2"
    ink-muted: "#9C9C9C"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#1F3A6B"
  warning: "#9C5B12"
  success: "#2F6B3C"
  error: "#B3001B"

colours-semantic-dark:
  info: "#80A0DA"
  warning: "#EEB16D"
  success: "#89D299"
  error: "#FF5C74"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#1F3A6B"
    background-colour: "#1F3A6B"
  warning:
    icon: warning
    primary-colour: "#9C5B12"
    background-colour: "#9C5B12"
  success:
    icon: success
    primary-colour: "#2F6B3C"
    background-colour: "#2F6B3C"
  error:
    icon: error
    primary-colour: "#B3001B"
    background-colour: "#B3001B"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:IBM Plex Sans:400"
font-heading: "bunny:IBM Plex Sans:700"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 78em
nav-width: 20em
