# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — sunset
# Warm coral and terracotta on bone. Confident, approachable.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#CC4A2E"
    surface: "#FBEFE0"
    page: "#FFFAF3"
    ink: "#2A1B14"
    ink-muted: "#7A6256"
  dark:
    primary: "#FF8A66"
    surface: "#271B14"
    page: "#1B130E"
    ink: "#F5E9DD"
    ink-muted: "#B49B8A"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#3B73C4"
  warning: "#CC4A2E"
  success: "#3F8F60"
  error: "#B23A24"

colours-semantic-dark:
  info: "#82A5D9"
  warning: "#E18C7A"
  success: "#89D2A7"
  error: "#E48877"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#3B73C4"
    background-colour: "#3B73C4"
  warning:
    icon: warning
    primary-colour: "#CC4A2E"
    background-colour: "#CC4A2E"
  success:
    icon: success
    primary-colour: "#3F8F60"
    background-colour: "#3F8F60"
  error:
    icon: error
    primary-colour: "#B23A24"
    background-colour: "#B23A24"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:Manrope:400"
font-heading: "bunny:Manrope:800"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.65      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 78em
nav-width: 20em
