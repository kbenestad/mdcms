# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — sage
# Warm, calm, editorial-feeling. Cream paper + forest green.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#2F7A5A"
    surface: "#F1EEE3"
    page: "#FAF8F2"
    ink: "#1F2A24"
    ink-muted: "#6B7A72"
  dark:
    primary: "#74D1A4"
    surface: "#172220"
    page: "#0F1714"
    ink: "#E8EDE9"
    ink-muted: "#8AA396"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#2F7A5A"
  warning: "#B26A1F"
  success: "#2F7A5A"
  error: "#B33A3A"

colours-semantic-dark:
  info: "#89D2B3"
  warning: "#E7AF74"
  success: "#89D2B3"
  error: "#D78484"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#2F7A5A"
    background-colour: "#2F7A5A"
  warning:
    icon: warning
    primary-colour: "#B26A1F"
    background-colour: "#B26A1F"
  success:
    icon: success
    primary-colour: "#2F7A5A"
    background-colour: "#2F7A5A"
  error:
    icon: error
    primary-colour: "#B33A3A"
    background-colour: "#B33A3A"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:DM Sans:400"
font-heading: "bunny:DM Sans:700"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
