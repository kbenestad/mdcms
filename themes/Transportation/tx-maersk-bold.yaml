# mdcms theme v0.6.0
# mdcms theme — maersk · bold
# Maersk cornflower blue with container white — global shipping liveried.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#42B0D5"
    surface: "#42B0D5"
    page: "#FFFFFF"
    ink: "#0A2A3A"
    ink-muted: "#5C7888"
    on-surface: "var(--font-colour)"
    on-surface-active: "var(--font-colour)"
    on-surface-title: "var(--nav-link-colour)"
    on-surface-heading: "var(--font-colour)"
    on-surface-note: "var(--font-colour)"
    on-surface-icon: "var(--font-colour)"
  dark:
    primary: "#42B0D5"
    surface: "#031620"
    page: "#062430"
    ink: "#FFFFFF"
    ink-muted: "#9DC0D0"
    on-surface: "#E2E2E2"
    on-surface-active: "#42B0D5"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "#9A9A9A"
    on-surface-note: "#9A9A9A"
    on-surface-icon: "#9A9A9A"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#2B5797"
  warning: "#B26A1F"
  success: "#2F7A4A"
  error: "#C13030"

colours-semantic-dark:
  info: "#80A5DB"
  warning: "#E7AF74"
  success: "#89D2A3"
  error: "#DE7C7C"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#2B5797"
    background-colour: "#2B5797"
  warning:
    icon: warning
    primary-colour: "#B26A1F"
    background-colour: "#B26A1F"
  success:
    icon: success
    primary-colour: "#2F7A4A"
    background-colour: "#2F7A4A"
  error:
    icon: error
    primary-colour: "#C13030"
    background-colour: "#C13030"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:Inter:400"
font-heading: "bunny:Inter:700"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
