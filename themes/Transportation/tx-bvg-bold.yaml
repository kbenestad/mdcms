# mdcms theme v0.6.0
# mdcms theme — bvg · bold
# BVG yellow — the colour of every Berlin U-Bahn and Doppeldecker.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#1A1A1A"
    surface: "#FCD600"
    page: "#FFFFFF"
    ink: "#1A1A1A"
    ink-muted: "#5C5C5C"
    on-surface: "rgba(0,0,0,0.85)"
    on-surface-active: "#1A1A1A"
    on-surface-title: "#000000"
    on-surface-heading: "rgba(0,0,0,0.60)"
    on-surface-note: "rgba(0,0,0,0.65)"
    on-surface-icon: "rgba(0,0,0,0.65)"
  dark:
    primary: "#FCD600"
    surface: "#000000"
    page: "#0A0A0A"
    ink: "#FFFFFF"
    ink-muted: "#A8A8A8"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#2B5797"
  warning: "#B26A1F"
  success: "#2F7A4A"
  error: "#C13030"

colours-semantic-dark:
  info: "#80A5DB"
  warning: "#E7AF74"
  success: "#89D2A3"
  error: "#DE7C7C"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#2B5797"
    background-colour: "#2B5797"
  warning:
    icon: warning
    primary-colour: "#B26A1F"
    background-colour: "#B26A1F"
  success:
    icon: success
    primary-colour: "#2F7A4A"
    background-colour: "#2F7A4A"
  error:
    icon: error
    primary-colour: "#C13030"
    background-colour: "#C13030"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:Inter:400"
font-heading: "bunny:Inter:700"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
