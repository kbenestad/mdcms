# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — deutsche bahn · ice · muted
# High-speed white with terra-cotta accent. Travel-day calm.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#7A2030"
    surface: "#EEE8E5"
    page: "#FBFAF8"
    ink: "#1F1A1A"
    ink-muted: "#6E6868"
  dark:
    primary: "#D85060"
    surface: "#1A1818"
    page: "#0F0E0E"
    ink: "#EFEDEC"
    ink-muted: "#A09898"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#2B5797"
  warning: "#B26A1F"
  success: "#2F7A4A"
  error: "#C13030"

colours-semantic-dark:
  info: "#80A5DB"
  warning: "#E7AF74"
  success: "#89D2A3"
  error: "#DE7C7C"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#2B5797"
    background-colour: "#2B5797"
  warning:
    icon: warning
    primary-colour: "#B26A1F"
    background-colour: "#B26A1F"
  success:
    icon: success
    primary-colour: "#2F7A4A"
    background-colour: "#2F7A4A"
  error:
    icon: error
    primary-colour: "#C13030"
    background-colour: "#C13030"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:Public Sans:400"
font-heading: "bunny:Public Sans:700"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
