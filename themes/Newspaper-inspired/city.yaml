# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — city
# The Financial Times' signature salmon paper (#fff1e5) with the darker
# FT-pink (#fcd0b1) they use behind labels for the nav surface: a light
# display serif for headlines over a clean sans body, teal link accent.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#0D7680"
    surface: "#FCD0B1"
    page: "#FFF1E5"
    ink: "#33302E"
    ink-muted: "#66605C"
  dark:
    primary: "#7FC4DB"
    surface: "#241C17"
    page: "#181310"
    ink: "#EFE6DA"
    ink-muted: "#A89A89"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#0D7680"
  warning: "#9C6B12"
  success: "#2F6B3C"
  error: "#9B1B1B"

colours-semantic-dark:
  info: "#7FC4DB"
  warning: "#E8B15E"
  success: "#89D299"
  error: "#E77474"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#0D7680"
    background-colour: "#0D7680"
  warning:
    icon: warning
    primary-colour: "#9C6B12"
    background-colour: "#9C6B12"
  success:
    icon: success
    primary-colour: "#2F6B3C"
    background-colour: "#2F6B3C"
  error:
    icon: error
    primary-colour: "#9B1B1B"
    background-colour: "#9B1B1B"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:Public Sans:400"
font-heading: "bunny:Fraunces:300"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.60      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 76em
nav-width: 20em
