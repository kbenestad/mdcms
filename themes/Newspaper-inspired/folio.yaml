# mdcms theme v0.6.0
# mdcms theme — folio
# Understated Montserrat headings over a serif body, all in warm cream tones.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#1A1A1A"
    surface: "#FAF6EC"
    page: "#FDFBF5"
    ink: "#1A1A1A"
    ink-muted: "#6F6A5C"
    heading: "#1A1A1A"
  dark:
    primary: "#E5DCC3"
    surface: "#1E1B15"
    page: "#15130F"
    ink: "#EDE6D5"
    ink-muted: "#A39C89"
    heading: "#EDE6D5"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#2B5797"
  warning: "#A35A0F"
  success: "#2F6B3C"
  error: "#9B1B1B"

colours-semantic-dark:
  info: "#80A5DB"
  warning: "#F1AE6A"
  success: "#89D299"
  error: "#E77474"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#2B5797"
    background-colour: "#2B5797"
  warning:
    icon: warning
    primary-colour: "#A35A0F"
    background-colour: "#A35A0F"
  success:
    icon: success
    primary-colour: "#2F6B3C"
    background-colour: "#2F6B3C"
  error:
    icon: error
    primary-colour: "#9B1B1B"
    background-colour: "#9B1B1B"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:Merriweather:400"
font-heading: "bunny:Montserrat:600"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.65      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 76em
nav-width: 20em
