# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — ledger
# Serif headlines, sans body. Paper white with a hint of salmon in the chrome.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#1A1A1A"
    surface: "#FBEFE9"
    page: "#FFFFFF"
    ink: "#1A1A1A"
    ink-muted: "#5C564B"
    heading: "#1A1A1A"
  dark:
    primary: "#F4D9CE"
    surface: "#2A1F1A"
    page: "#1A1714"
    ink: "#F4EAE0"
    ink-muted: "#A89B8E"
    heading: "#F4EAE0"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#2B5797"
  warning: "#A35A0F"
  success: "#2F6B3C"
  error: "#9B1B1B"

colours-semantic-dark:
  info: "#80A5DB"
  warning: "#F1AE6A"
  success: "#89D299"
  error: "#E77474"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#2B5797"
    background-colour: "#2B5797"
  warning:
    icon: warning
    primary-colour: "#A35A0F"
    background-colour: "#A35A0F"
  success:
    icon: success
    primary-colour: "#2F6B3C"
    background-colour: "#2F6B3C"
  error:
    icon: error
    primary-colour: "#9B1B1B"
    background-colour: "#9B1B1B"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:Source Sans 3:400"
font-heading: "bunny:Instrument Serif:400"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.60      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 76em
nav-width: 20em
