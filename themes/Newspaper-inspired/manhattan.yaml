# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — manhattan
# White-on-white styled after The Wall Street Journal: bold black serif
# headlines (Escrow-style) over a light-weight sans body, deep red accent.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#AE1917"
    surface: "#F4F5F7"
    page: "#FFFFFF"
    ink: "#1A1A1A"
    ink-muted: "#6F6F6F"
    heading: "#1A1A1A"
  dark:
    primary: "#E58C8A"
    surface: "#1D1D1D"
    page: "#131313"
    ink: "#EDEDED"
    ink-muted: "#9A9A9A"
    heading: "#EDEDED"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#1F3A6B"
  warning: "#9C5B12"
  success: "#0A8200"
  error: "#AE1917"

colours-semantic-dark:
  info: "#8AA8D9"
  warning: "#EEB16D"
  success: "#7FD262"
  error: "#E77474"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#1F3A6B"
    background-colour: "#1F3A6B"
  warning:
    icon: warning
    primary-colour: "#9C5B12"
    background-colour: "#9C5B12"
  success:
    icon: success
    primary-colour: "#0A8200"
    background-colour: "#0A8200"
  error:
    icon: error
    primary-colour: "#AE1917"
    background-colour: "#AE1917"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:Work Sans:300"
font-heading: "bunny:Zilla Slab:700"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.55      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 74em
nav-width: 20em
