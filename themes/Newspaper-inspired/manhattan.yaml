# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — manhattan
# Cream newsprint styled after The Wall Street Journal: elegant slab-serif
# headlines over a Garamond-style body, deep masthead red accent.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#8C1515"
    surface: "#F4EEE1"
    page: "#FBF8F0"
    ink: "#1A1A1A"
    ink-muted: "#6B6355"
  dark:
    primary: "#E28787"
    surface: "#221E17"
    page: "#17140F"
    ink: "#EDE7D8"
    ink-muted: "#A79C89"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#1F3A6B"
  warning: "#9C5B12"
  success: "#2F6B3C"
  error: "#A3231F"

colours-semantic-dark:
  info: "#8AA8D9"
  warning: "#EEB16D"
  success: "#89D299"
  error: "#E77474"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#1F3A6B"
    background-colour: "#1F3A6B"
  warning:
    icon: warning
    primary-colour: "#9C5B12"
    background-colour: "#9C5B12"
  success:
    icon: success
    primary-colour: "#2F6B3C"
    background-colour: "#2F6B3C"
  error:
    icon: error
    primary-colour: "#A3231F"
    background-colour: "#A3231F"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:EB Garamond:500"
font-heading: "bunny:Zilla Slab:700"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.60      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 74em
nav-width: 20em
