# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — gotham
# Black-on-white broadsheet styled after The New York Times: slab-serif
# headlines, Georgia-style serif body, classic newsprint blue for links.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#326891"
    surface: "#F2F2F2"
    page: "#FFFFFF"
    ink: "#121212"
    ink-muted: "#666666"
  dark:
    primary: "#7EB2D9"
    surface: "#1A1A1A"
    page: "#121212"
    ink: "#F2F2F2"
    ink-muted: "#9A9A9A"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#326891"
  warning: "#9C6B12"
  success: "#2F6B3C"
  error: "#B3001B"

colours-semantic-dark:
  info: "#7EB2D9"
  warning: "#E8B15E"
  success: "#89D299"
  error: "#FF5C74"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#326891"
    background-colour: "#326891"
  warning:
    icon: warning
    primary-colour: "#9C6B12"
    background-colour: "#9C6B12"
  success:
    icon: success
    primary-colour: "#2F6B3C"
    background-colour: "#2F6B3C"
  error:
    icon: error
    primary-colour: "#B3001B"
    background-colour: "#B3001B"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:Noto Serif:400"
font-heading: "bunny:Bitter:700"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.55      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 74em
nav-width: 20em
