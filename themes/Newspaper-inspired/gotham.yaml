# mdcms theme v0.6.0
# mdcms theme — gotham
# Black-on-white broadsheet styled after The New York Times: small, bold
# serif headlines (Cheltenham-style) over a Georgia-style serif body. Links,
# tabs and accordions pick up the paper's muted byline grey; the newsprint
# blue is reserved for the info callout only.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#727272"
    surface: "#F2F2F2"
    page: "#FFFFFF"
    ink: "#121212"
    ink-muted: "#727272"
    heading: "#121212"
  dark:
    primary: "#9A9A9A"
    surface: "#1A1A1A"
    page: "#121212"
    ink: "#F2F2F2"
    ink-muted: "#9A9A9A"
    heading: "#F2F2F2"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#326891"
  warning: "#9C6B12"
  success: "#2F6B3C"
  error: "#B3001B"

colours-semantic-dark:
  info: "#7CA7C8"
  warning: "#E8B15E"
  success: "#89D299"
  error: "#FF5C74"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#326891"
    background-colour: "#326891"
  warning:
    icon: warning
    primary-colour: "#9C6B12"
    background-colour: "#9C6B12"
  success:
    icon: success
    primary-colour: "#2F6B3C"
    background-colour: "#2F6B3C"
  error:
    icon: error
    primary-colour: "#B3001B"
    background-colour: "#B3001B"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:Gelasio:400"
font-heading: "bunny:Domine:700"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.50      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 74em
nav-width: 20em
