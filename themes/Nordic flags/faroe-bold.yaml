# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — faroe islands · bold
# Merkið — red cross, blue fimbriation. Vivid Atlantic palette.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
light:
  accent: "#ED2939"
  background: "#FFFFFF"
  nav-background: "#0065BD"
  text: "#1A1A1A"
  text-muted: "#5C5C5C"
  nav-link: "rgba(255,255,255,0.92)"
  nav-link-active: "#FFFFFF"
  nav-section-heading: "rgba(255,255,255,0.65)"
  nav-sitename: "#FFFFFF"
  nav-description: "rgba(255,255,255,0.70)"
  nav-toggle: "rgba(255,255,255,0.70)"

dark:
  accent: "#ED2939"
  background: "#0065BD"
  nav-background: "#003F7A"
  text: "#FFFFFF"
  text-muted: "#9DB8DC"
  nav-link: "rgba(255,255,255,0.92)"
  nav-link-active: "#FFFFFF"
  nav-section-heading: "rgba(255,255,255,0.65)"
  nav-sitename: "#FFFFFF"
  nav-description: "rgba(255,255,255,0.70)"
  nav-toggle: "rgba(255,255,255,0.70)"

# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#0065BD"
  warning: "#B26A1F"
  success: "#2F7A4A"
  error: "#ED2939"

colours-semantic-dark:
  info: "#5CB3FF"
  warning: "#E7AF74"
  success: "#89D2A3"
  error: "#F26874"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#0065BD"
    background-colour: "#0065BD"
  warning:
    icon: warning
    primary-colour: "#B26A1F"
    background-colour: "#B26A1F"
  success:
    icon: success
    primary-colour: "#2F7A4A"
    background-colour: "#2F7A4A"
  error:
    icon: error
    primary-colour: "#ED2939"
    background-colour: "#ED2939"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:IBM Plex Sans:300"
font-heading: "bunny:IBM Plex Sans:600"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
