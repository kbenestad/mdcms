# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — greenland · muted
# Iceberg cream + glacier-red. Quieter Arctic palette.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
light:
  accent: "#9C2030"
  background: "#F8F5F0"
  nav-background: "#EADCDE"
  text: "#1F1A18"
  text-muted: "#6E5E5E"

dark:
  accent: "#D85060"
  background: "#180C0E"
  nav-background: "#1F1212"
  text: "#F0E5DC"
  text-muted: "#A8908A"

# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#2A4E8A"
  warning: "#B26A1F"
  success: "#2F7A4A"
  error: "#D00C33"

colours-semantic-dark:
  info: "#82A3D9"
  warning: "#E7AF74"
  success: "#89D2A3"
  error: "#F66582"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#2A4E8A"
    background-colour: "#2A4E8A"
  warning:
    icon: warning
    primary-colour: "#B26A1F"
    background-colour: "#B26A1F"
  success:
    icon: success
    primary-colour: "#2F7A4A"
    background-colour: "#2F7A4A"
  error:
    icon: error
    primary-colour: "#D00C33"
    background-colour: "#D00C33"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:IBM Plex Sans:300"
font-heading: "bunny:IBM Plex Sans:600"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
