# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — sweden · bold
# Royal blue + gold. Sunny sidebar, regal accent.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
light:
  accent: "#006AA7"
  background: "#FFFFFF"
  nav-background: "#FECC00"
  text: "#003C66"
  text-muted: "#5C7898"
  nav-link: "rgba(0,0,0,0.85)"
  nav-link-active: "#006AA7"
  nav-section-heading: "rgba(0,0,0,0.60)"
  nav-sitename: "#000000"
  nav-description: "rgba(0,0,0,0.65)"
  nav-toggle: "rgba(0,0,0,0.65)"

dark:
  accent: "#FECC00"
  background: "#003C66"
  nav-background: "#002545"
  text: "#FFFFFF"
  text-muted: "#9DB4D0"
  nav-link: "rgba(255,255,255,0.92)"
  nav-link-active: "#FECC00"
  nav-section-heading: "rgba(255,255,255,0.65)"
  nav-sitename: "#FFFFFF"
  nav-description: "rgba(255,255,255,0.70)"
  nav-toggle: "rgba(255,255,255,0.70)"

# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#006AA7"
  warning: "#B26A1F"
  success: "#2F7A4A"
  error: "#9C3A2A"

colours-semantic-dark:
  info: "#5CC3FF"
  warning: "#E7AF74"
  success: "#89D2A3"
  error: "#DC8C7E"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#006AA7"
    background-colour: "#006AA7"
  warning:
    icon: warning
    primary-colour: "#B26A1F"
    background-colour: "#B26A1F"
  success:
    icon: success
    primary-colour: "#2F7A4A"
    background-colour: "#2F7A4A"
  error:
    icon: error
    primary-colour: "#9C3A2A"
    background-colour: "#9C3A2A"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:IBM Plex Sans:300"
font-heading: "bunny:IBM Plex Sans:600"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
