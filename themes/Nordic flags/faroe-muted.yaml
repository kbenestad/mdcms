# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — faroe islands · muted
# Seafarer blue on grey-white. The red rests in the callouts.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#2F6BAA"
    surface: "#E2E8EE"
    page: "#FBFBFA"
    ink: "#1A1E2A"
    ink-muted: "#6E7588"
  dark:
    primary: "#7DA8D8"
    surface: "#16213A"
    page: "#0E1620"
    ink: "#EAEDF2"
    ink-muted: "#90A0BC"
    on-surface: "#E2E2E2"
    on-surface-active: "#7DA8D8"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "#9A9A9A"
    on-surface-note: "#9A9A9A"
    on-surface-icon: "#9A9A9A"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#2A4E8A"
  warning: "#B26A1F"
  success: "#2F7A4A"
  error: "#ED2939"

colours-semantic-dark:
  info: "#82A3D9"
  warning: "#E7AF74"
  success: "#89D2A3"
  error: "#F26874"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#2A4E8A"
    background-colour: "#2A4E8A"
  warning:
    icon: warning
    primary-colour: "#B26A1F"
    background-colour: "#B26A1F"
  success:
    icon: success
    primary-colour: "#2F7A4A"
    background-colour: "#2F7A4A"
  error:
    icon: error
    primary-colour: "#ED2939"
    background-colour: "#ED2939"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:IBM Plex Sans:300"
font-heading: "bunny:IBM Plex Sans:600"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
