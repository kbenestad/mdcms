# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — finland · muted
# Softer lake-blue on cool grey-white. Calm and Scandinavian.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
light:
  accent: "#3A6BAA"
  background: "#FBFCFE"
  nav-background: "#E3EAF3"
  text: "#1F2D44"
  text-muted: "#697390"

dark:
  accent: "#94B5DC"
  background: "#0E1622"
  nav-background: "#16213A"
  text: "#EAEEF4"
  text-muted: "#8E96AC"
  nav-link: "#E2E2E2"
  nav-link-active: "#94B5DC"
  nav-section-heading: "#9A9A9A"
  nav-sitename: "#FFFFFF"
  nav-description: "#9A9A9A"
  nav-toggle: "#9A9A9A"

# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#2A4E8A"
  warning: "#B26A1F"
  success: "#2F7A4A"
  error: "#9C3A2A"

colours-semantic-dark:
  info: "#82A3D9"
  warning: "#E7AF74"
  success: "#89D2A3"
  error: "#DC8C7E"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#2A4E8A"
    background-colour: "#2A4E8A"
  warning:
    icon: warning
    primary-colour: "#B26A1F"
    background-colour: "#B26A1F"
  success:
    icon: success
    primary-colour: "#2F7A4A"
    background-colour: "#2F7A4A"
  error:
    icon: error
    primary-colour: "#9C3A2A"
    background-colour: "#9C3A2A"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:IBM Plex Sans:300"
font-heading: "bunny:IBM Plex Sans:600"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
