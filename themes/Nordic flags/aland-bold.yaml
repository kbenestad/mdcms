# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — åland · bold
# Scandinavian cross with a red heart — three flag colours on full display.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
light:
  accent: "#D21034"
  background: "#FFFFFF"
  nav-background: "#0053A5"
  text: "#002A5E"
  text-muted: "#5C7898"
  nav-link: "rgba(255,255,255,0.92)"
  nav-link-active: "#FFFFFF"
  nav-section-heading: "rgba(255,255,255,0.65)"
  nav-sitename: "#FFFFFF"
  nav-description: "rgba(255,255,255,0.70)"
  nav-toggle: "rgba(255,255,255,0.70)"

dark:
  accent: "#FFCD00"
  background: "#0053A5"
  nav-background: "#002A5E"
  text: "#FFFFFF"
  text-muted: "#9EB8DC"
  nav-link: "rgba(255,255,255,0.92)"
  nav-link-active: "#FFCD00"
  nav-section-heading: "rgba(255,255,255,0.65)"
  nav-sitename: "#FFFFFF"
  nav-description: "rgba(255,255,255,0.70)"
  nav-toggle: "rgba(255,255,255,0.70)"

# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#0053A5"
  warning: "#B26A1F"
  success: "#2F7A4A"
  error: "#D21034"

colours-semantic-dark:
  info: "#5CAEFF"
  warning: "#E7AF74"
  success: "#89D2A3"
  error: "#F36781"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#0053A5"
    background-colour: "#0053A5"
  warning:
    icon: warning
    primary-colour: "#B26A1F"
    background-colour: "#B26A1F"
  success:
    icon: success
    primary-colour: "#2F7A4A"
    background-colour: "#2F7A4A"
  error:
    icon: error
    primary-colour: "#D21034"
    background-colour: "#D21034"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:IBM Plex Sans:300"
font-heading: "bunny:IBM Plex Sans:600"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
