# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — iceland · muted
# Quieter take — ocean-blue accent on stone-white, no red.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
light:
  accent: "#02529C"
  background: "#FBFAF7"
  nav-background: "#E4E8EE"
  text: "#1A2438"
  text-muted: "#6E7588"

dark:
  accent: "#7DA4D8"
  background: "#0D1422"
  nav-background: "#15203A"
  text: "#E8ECF4"
  text-muted: "#9098AC"
  nav-link: "#E2E2E2"
  nav-link-active: "#7DA4D8"
  nav-section-heading: "#9A9A9A"
  nav-sitename: "#FFFFFF"
  nav-description: "#9A9A9A"
  nav-toggle: "#9A9A9A"

# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#2A4E8A"
  warning: "#B26A1F"
  success: "#2F7A4A"
  error: "#DC1E35"

colours-semantic-dark:
  info: "#82A3D9"
  warning: "#E7AF74"
  success: "#89D2A3"
  error: "#EB6F7E"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#2A4E8A"
    background-colour: "#2A4E8A"
  warning:
    icon: warning
    primary-colour: "#B26A1F"
    background-colour: "#B26A1F"
  success:
    icon: success
    primary-colour: "#2F7A4A"
    background-colour: "#2F7A4A"
  error:
    icon: error
    primary-colour: "#DC1E35"
    background-colour: "#DC1E35"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:IBM Plex Sans:300"
font-heading: "bunny:IBM Plex Sans:600"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
