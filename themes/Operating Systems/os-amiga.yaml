# mdcms theme v0.6.0
# mdcms theme — os-amiga
# Workbench 1.3 revival. Iconic blue/orange/white/black on Workbench grey.
# Pixel-screen energy. The most idiosyncratic theme in the set.
#
# Original Workbench 1.x palette (4 colours, hardware-fixed):
#   #0055AA  blue (window chrome, background)
#   #FFFFFF  white
#   #000000  black
#   #FF8800  orange (highlights)
# 2.x onward added the warm grey #AAAAAA.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#FF8800"
    surface: "#0055AA"
    page: "#FFFFFF"
    ink: "#000000"
    ink-muted: "#555555"
  dark:
    primary: "#FF8800"
    surface: "#003D7A"
    page: "#0055AA"
    ink: "#FFFFFF"
    ink-muted: "#AAC4E0"


# ──────────────────────────────────
# Semantic colours
# ──────────────────────────────────
colours-semantic:
  info: "#0055AA"
  warning: "#FF8800"
  success: "#00AA55"
  error: "#CC0000"

colours-semantic-dark:
  info: "#7FB2E0"
  warning: "#FFB04A"
  success: "#7FD9A4"
  error: "#FF6B6B"

# ──────────────────────────────────
# Callout defaults
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#0055AA"
    background-colour: "#0055AA"
  warning:
    icon: warning
    primary-colour: "#FF8800"
    background-colour: "#FF8800"
  success:
    icon: success
    primary-colour: "#00AA55"
    background-colour: "#00AA55"
  error:
    icon: error
    primary-colour: "#CC0000"
    background-colour: "#CC0000"

# ──────────────────────────────────
# Typography
# Workbench (the Google font) for headings is a deliberate pun on
# Workbench (the Amiga desktop) — its stencilled, hand-labelled-hardware
# look reads as "system font on a beige box" without the illegibility of
# a raw pixel font at paragraph size. IBM Plex Mono keeps body copy
# readable. Preferred for true Workbench-fidelity: "Topaz" or "Topaz New"
# (free pixel font replicas of the Amiga system font, widely available as
# TTF) if you want to swap them in yourself.
# ──────────────────────────────────
font-body: "bunny:IBM Plex Mono:400"
font-heading: "google:Workbench:400"
font-size: 1.00
line-height: 1.45

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 76em
nav-width: 20em
