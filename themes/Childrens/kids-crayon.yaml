# mdcms theme v0.6.0
# mdcms theme — kids · crayon
# Saturated primaries on warm white. Bold but dignified — Nunito Sans bold.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#E63946"
    surface: "#FFE8C8"
    page: "#FFFEF8"
    ink: "#1A1A1A"
    ink-muted: "#6E6052"
    on-surface: "#1A1A1A"
    on-surface-active: "#A12831"
    on-surface-title: "#1A1A1A"
    on-surface-heading: "#6E6052"
    on-surface-note: "#6E6052"
    on-surface-icon: "#6E6052"
  dark:
    primary: "#FF8B6E"
    surface: "#2A2418"
    page: "#1A1814"
    ink: "#FAF8F0"
    ink-muted: "#A89878"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#2A6FCF"
  warning: "#E69B1F"
  success: "#2F8A4A"
  error: "#E63946"

colours-semantic-dark:
  info: "#77A5E3"
  warning: "#EFBD6C"
  success: "#85D69D"
  error: "#ED6E78"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#2A6FCF"
    background-colour: "#2A6FCF"
  warning:
    icon: warning
    primary-colour: "#E69B1F"
    background-colour: "#E69B1F"
  success:
    icon: success
    primary-colour: "#2F8A4A"
    background-colour: "#2F8A4A"
  error:
    icon: error
    primary-colour: "#E63946"
    background-colour: "#E63946"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:Nunito Sans:400"
font-heading: "bunny:Nunito Sans:800"
font-size: 1.05        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
