# mdcms theme v0.6.0
# mdcms theme — one dark
# Atom's signature theme — soft greys with cool primary accents.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#4078F2"
    surface: "#F0F0F0"
    page: "#FAFAFA"
    ink: "#383A42"
    ink-muted: "#A0A1A7"
    on-surface: "#383A42"
    on-surface-active: "#4078F2"
    on-surface-title: "#383A42"
    on-surface-heading: "#5C5C5C"
    on-surface-note: "#5C5C5C"
    on-surface-icon: "#5C5C5C"
  dark:
    primary: "#61AFEF"
    surface: "#21252B"
    page: "#282C34"
    ink: "#ABB2BF"
    ink-muted: "#5C6370"
    on-surface: "#E2E2E2"
    on-surface-active: "#61AFEF"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "#9A9A9A"
    on-surface-note: "#9A9A9A"
    on-surface-icon: "#9A9A9A"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#61AFEF"
  warning: "#E5C07B"
  success: "#98C379"
  error: "#E06C75"

colours-semantic-dark:
  info: "#6BB4F0"
  warning: "#E5C07B"
  success: "#A7D289"
  error: "#E37880"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#61AFEF"
    background-colour: "#61AFEF"
  warning:
    icon: warning
    primary-colour: "#E5C07B"
    background-colour: "#E5C07B"
  success:
    icon: success
    primary-colour: "#98C379"
    background-colour: "#98C379"
  error:
    icon: error
    primary-colour: "#E06C75"
    background-colour: "#E06C75"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:IBM Plex Sans:300"
font-heading: "bunny:IBM Plex Sans:600"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
