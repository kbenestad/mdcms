# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — solarized
# Ethan Schoonover's precision palette — same hues, swapped backgrounds.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#268BD2"
    surface: "#EEE8D5"
    page: "#FDF6E3"
    ink: "#073642"
    ink-muted: "#586E75"
  dark:
    primary: "#268BD2"
    surface: "#073642"
    page: "#002B36"
    ink: "#EEE8D5"
    ink-muted: "#93A1A1"
    on-surface: "rgba(255,255,255,0.92)"
    on-surface-active: "#268BD2"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "rgba(255,255,255,0.65)"
    on-surface-note: "rgba(255,255,255,0.70)"
    on-surface-icon: "rgba(255,255,255,0.70)"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#268BD2"
  warning: "#CB4B16"
  success: "#859900"
  error: "#DC322F"

colours-semantic-dark:
  info: "#75B7E6"
  warning: "#EF926C"
  success: "#EAFF5C"
  error: "#E77573"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#268BD2"
    background-colour: "#268BD2"
  warning:
    icon: warning
    primary-colour: "#CB4B16"
    background-colour: "#CB4B16"
  success:
    icon: success
    primary-colour: "#859900"
    background-colour: "#859900"
  error:
    icon: error
    primary-colour: "#DC322F"
    background-colour: "#DC322F"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:IBM Plex Sans:300"
font-heading: "bunny:IBM Plex Sans:600"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
