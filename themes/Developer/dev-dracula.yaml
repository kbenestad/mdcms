# mdcms theme v0.6.0
# mdcms theme — dracula
# Gothic purple-on-shadow. The canonical IDE pink + purple + cyan palette.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#BD93F9"
    surface: "#E8E6F0"
    page: "#F8F8F2"
    ink: "#282A36"
    ink-muted: "#6272A4"
    on-surface: "#282A36"
    on-surface-active: "#1A1A1A"
    on-surface-title: "#282A36"
    on-surface-heading: "#6272A4"
    on-surface-note: "#6272A4"
    on-surface-icon: "#6272A4"
  dark:
    primary: "#BD93F9"
    surface: "#21222C"
    page: "#282A36"
    ink: "#F8F8F2"
    ink-muted: "#6272A4"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#8BE9FD"
  warning: "#FFB86C"
  success: "#50FA7B"
  error: "#FF5555"

colours-semantic-dark:
  info: "#8BE9FD"
  warning: "#FFB86C"
  success: "#50FA7B"
  error: "#FF5C5C"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#8BE9FD"
    background-colour: "#8BE9FD"
  warning:
    icon: warning
    primary-colour: "#FFB86C"
    background-colour: "#FFB86C"
  success:
    icon: success
    primary-colour: "#50FA7B"
    background-colour: "#50FA7B"
  error:
    icon: error
    primary-colour: "#FF5555"
    background-colour: "#FF5555"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:IBM Plex Sans:300"
font-heading: "bunny:IBM Plex Sans:600"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
