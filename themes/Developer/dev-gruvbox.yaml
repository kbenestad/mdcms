# mdcms theme v0.6.0
# mdcms theme — gruvbox
# Retro-warm groovy palette — pape's cult-favourite earth tones.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#076678"
    surface: "#EBDBB2"
    page: "#FBF1C7"
    ink: "#3C3836"
    ink-muted: "#665C54"
    on-surface: "rgba(255,255,255,0.92)"
    on-surface-active: "#076678"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "rgba(255,255,255,0.65)"
    on-surface-note: "rgba(255,255,255,0.70)"
    on-surface-icon: "rgba(255,255,255,0.70)"
  dark:
    primary: "#83A598"
    surface: "#3C3836"
    page: "#282828"
    ink: "#EBDBB2"
    ink-muted: "#A89984"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#458588"
  warning: "#D65D0E"
  success: "#98971A"
  error: "#CC241D"

colours-semantic-dark:
  info: "#89CFD2"
  warning: "#F59E66"
  success: "#E7E674"
  error: "#EB7570"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#458588"
    background-colour: "#458588"
  warning:
    icon: warning
    primary-colour: "#D65D0E"
    background-colour: "#D65D0E"
  success:
    icon: success
    primary-colour: "#98971A"
    background-colour: "#98971A"
  error:
    icon: error
    primary-colour: "#CC241D"
    background-colour: "#CC241D"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:IBM Plex Sans:300"
font-heading: "bunny:IBM Plex Sans:600"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
