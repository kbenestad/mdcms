# mdcms theme v0.6.0
# mdcms theme — red · charcoal
# White content with a charcoal nav sidebar. Colour pops on dark.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#DC2626"
    surface: "#1A1A1F"
    page: "#FFFFFF"
    ink: "#161618"
    ink-muted: "#5C5F6E"
    on-surface: "#E2E2E2"
    on-surface-active: "#DC2626"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "#9A9A9A"
    on-surface-note: "#9A9A9A"
    on-surface-icon: "#9A9A9A"
  dark:
    primary: "#FCA5A5"
    surface: "#000000"
    page: "#0A0A0C"
    ink: "#F1EFEC"
    ink-muted: "#9C9A95"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#2B5797"
  warning: "#B26A1F"
  success: "#2F7A4A"
  error: "#DC2626"

colours-semantic-dark:
  info: "#80A5DB"
  warning: "#E7AF74"
  success: "#89D2A3"
  error: "#E87272"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#2B5797"
    background-colour: "#2B5797"
  warning:
    icon: warning
    primary-colour: "#B26A1F"
    background-colour: "#B26A1F"
  success:
    icon: success
    primary-colour: "#2F7A4A"
    background-colour: "#2F7A4A"
  error:
    icon: error
    primary-colour: "#DC2626"
    background-colour: "#DC2626"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:IBM Plex Sans:300"
font-heading: "bunny:IBM Plex Sans:600"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
