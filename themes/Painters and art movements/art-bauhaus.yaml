# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — bauhaus
# Dessau primaries, severe geometric grid. Red square, yellow triangle, blue circle.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#D8302F"
    surface: "#1A1A1A"
    page: "#FAFAF8"
    ink: "#161616"
    ink-muted: "#5C5C5C"
    on-surface: "#E2E2E2"
    on-surface-active: "#D8302F"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "#9A9A9A"
    on-surface-note: "#9A9A9A"
    on-surface-icon: "#9A9A9A"
  dark:
    primary: "#FFD500"
    surface: "#000000"
    page: "#0A0A0A"
    ink: "#F4F4F2"
    ink-muted: "#9C9C9C"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#1F4FA8"
  warning: "#FFD500"
  success: "#2F7A4A"
  error: "#D8302F"

colours-semantic-dark:
  info: "#759DE6"
  warning: "#FFD500"
  success: "#89D2A3"
  error: "#E57676"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#1F4FA8"
    background-colour: "#1F4FA8"
  warning:
    icon: warning
    primary-colour: "#FFD500"
    background-colour: "#FFD500"
  success:
    icon: success
    primary-colour: "#2F7A4A"
    background-colour: "#2F7A4A"
  error:
    icon: error
    primary-colour: "#D8302F"
    background-colour: "#D8302F"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:Public Sans:400"
font-heading: "bunny:Public Sans:800"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.65      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 78em
nav-width: 20em
