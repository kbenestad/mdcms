# mdcms theme v0.6.0
# mdcms theme — o'keeffe
# Ghost Ranch — bone, ochre, sage. New Mexico desert at midday.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#B85230"
    surface: "#B85230"
    page: "#F5EBDA"
    ink: "#2A1A14"
    ink-muted: "#7A6A54"
    on-surface: "rgba(255,255,255,0.92)"
    on-surface-active: "#FFFFFF"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "rgba(255,255,255,0.65)"
    on-surface-note: "rgba(255,255,255,0.70)"
    on-surface-icon: "rgba(255,255,255,0.70)"
  dark:
    primary: "#E08862"
    surface: "#2A1610"
    page: "#1A1108"
    ink: "#F4E5D0"
    ink-muted: "#B8A088"
    on-surface: "#E2E2E2"
    on-surface-active: "#E08862"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "#9A9A9A"
    on-surface-note: "#9A9A9A"
    on-surface-icon: "#9A9A9A"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#5A7A8A"
  warning: "#B85230"
  success: "#6E8A5A"
  error: "#9C2A1F"

colours-semantic-dark:
  info: "#89BAD2"
  warning: "#DD957E"
  success: "#A7D289"
  error: "#E48077"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#5A7A8A"
    background-colour: "#5A7A8A"
  warning:
    icon: warning
    primary-colour: "#B85230"
    background-colour: "#B85230"
  success:
    icon: success
    primary-colour: "#6E8A5A"
    background-colour: "#6E8A5A"
  error:
    icon: error
    primary-colour: "#9C2A1F"
    background-colour: "#9C2A1F"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:Lora:400"
font-heading: "bunny:Lora:600"
font-size: 1.05        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 78em
nav-width: 20em
