# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — rothko
# Two rectangles glowing into each other — oxblood plum and sunset orange on cream.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#C8431F"
    surface: "#5C2A2A"
    page: "#F5EBDC"
    ink: "#2A1414"
    ink-muted: "#6E5444"
    on-surface: "#E2E2E2"
    on-surface-active: "#FFFFFF"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "#9A9A9A"
    on-surface-note: "#9A9A9A"
    on-surface-icon: "#9A9A9A"
  dark:
    primary: "#FF7A4A"
    surface: "#2A0A0A"
    page: "#1F0E08"
    ink: "#F4E0CC"
    ink-muted: "#B89682"
    on-surface: "#E2E2E2"
    on-surface-active: "#FF7A4A"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "#9A9A9A"
    on-surface-note: "#9A9A9A"
    on-surface-icon: "#9A9A9A"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#5C2A6E"
  warning: "#C8431F"
  success: "#3F6B3C"
  error: "#9C2A1F"

colours-semantic-dark:
  info: "#BF89D2"
  warning: "#E98B72"
  success: "#8DD289"
  error: "#E48077"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#5C2A6E"
    background-colour: "#5C2A6E"
  warning:
    icon: warning
    primary-colour: "#C8431F"
    background-colour: "#C8431F"
  success:
    icon: success
    primary-colour: "#3F6B3C"
    background-colour: "#3F6B3C"
  error:
    icon: error
    primary-colour: "#9C2A1F"
    background-colour: "#9C2A1F"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:Newsreader:400"
font-heading: "bunny:Newsreader:700"
font-size: 1.05        # unitless multiplier (1.0 = 16px base)
line-height: 1.65      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 78em
nav-width: 20em
