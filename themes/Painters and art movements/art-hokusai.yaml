# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — hokusai
# Prussian blue and cream paper from The Great Wave — soft pink on the horizon.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#1B3D6E"
    surface: "#1B3D6E"
    page: "#F4ECDA"
    ink: "#0F1F38"
    ink-muted: "#6E6450"
    on-surface: "rgba(255,255,255,0.92)"
    on-surface-active: "#FFFFFF"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "rgba(255,255,255,0.65)"
    on-surface-note: "rgba(255,255,255,0.70)"
    on-surface-icon: "rgba(255,255,255,0.70)"
  dark:
    primary: "#7AA5D8"
    surface: "#06122A"
    page: "#0A1828"
    ink: "#F0E5CC"
    ink-muted: "#A0B0C8"
    on-surface: "#E2E2E2"
    on-surface-active: "#7AA5D8"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "#9A9A9A"
    on-surface-note: "#9A9A9A"
    on-surface-icon: "#9A9A9A"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#1B3D6E"
  warning: "#B58A1A"
  success: "#3F6B3C"
  error: "#B8536A"

colours-semantic-dark:
  info: "#7CA4DF"
  warning: "#EBC970"
  success: "#8DD289"
  error: "#D28999"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#1B3D6E"
    background-colour: "#1B3D6E"
  warning:
    icon: warning
    primary-colour: "#B58A1A"
    background-colour: "#B58A1A"
  success:
    icon: success
    primary-colour: "#3F6B3C"
    background-colour: "#3F6B3C"
  error:
    icon: error
    primary-colour: "#B8536A"
    background-colour: "#B8536A"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:Newsreader:400"
font-heading: "bunny:Newsreader:600"
font-size: 1.05        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 78em
nav-width: 20em
