# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — memphis
# 1980s Sottsass — saturated coral and turquoise on white. Postmodern, riotous.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#E94560"
    surface: "#0AB4B8"
    page: "#FFFFFF"
    ink: "#1A1A1A"
    ink-muted: "#5C5C5C"
    on-surface: "rgba(255,255,255,0.92)"
    on-surface-active: "#FFFFFF"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "rgba(255,255,255,0.65)"
    on-surface-note: "rgba(255,255,255,0.70)"
    on-surface-icon: "rgba(255,255,255,0.70)"
  dark:
    primary: "#FF6E8E"
    surface: "#062E32"
    page: "#0A0E14"
    ink: "#FFFFFF"
    ink-muted: "#9CB0B0"
    on-surface: "#E2E2E2"
    on-surface-active: "#FF6E8E"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "#9A9A9A"
    on-surface-note: "#9A9A9A"
    on-surface-icon: "#9A9A9A"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#0AB4B8"
  warning: "#F5B021"
  success: "#3FAE5A"
  error: "#E94560"

colours-semantic-dark:
  info: "#64F3F7"
  warning: "#F5B021"
  success: "#87D49A"
  error: "#EE6D82"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#0AB4B8"
    background-colour: "#0AB4B8"
  warning:
    icon: warning
    primary-colour: "#F5B021"
    background-colour: "#F5B021"
  success:
    icon: success
    primary-colour: "#3FAE5A"
    background-colour: "#3FAE5A"
  error:
    icon: error
    primary-colour: "#E94560"
    background-colour: "#E94560"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:Space Grotesk:400"
font-heading: "bunny:Space Grotesk:700"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.65      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 78em
nav-width: 20em
