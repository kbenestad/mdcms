# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — mondrian
# Primary red, yellow, blue on white with a black grid. De Stijl, full strength.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
light:
  accent: "#D72D2A"
  background: "#FFFFFF"
  nav-background: "#000000"
  text: "#0A0A0A"
  text-muted: "#5C5C5C"
  nav-link: "#E2E2E2"
  nav-link-active: "#D72D2A"
  nav-section-heading: "#9A9A9A"
  nav-sitename: "#FFFFFF"
  nav-description: "#9A9A9A"
  nav-toggle: "#9A9A9A"

dark:
  accent: "#FFD500"
  background: "#0A0A0A"
  nav-background: "#000000"
  text: "#FFFFFF"
  text-muted: "#A8A8A8"

# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#0A4DA8"
  warning: "#FFD500"
  success: "#2F7A4A"
  error: "#D72D2A"

colours-semantic-dark:
  info: "#65A2F6"
  warning: "#FFD500"
  success: "#89D2A3"
  error: "#E57876"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#0A4DA8"
    background-colour: "#0A4DA8"
  warning:
    icon: warning
    primary-colour: "#FFD500"
    background-colour: "#FFD500"
  success:
    icon: success
    primary-colour: "#2F7A4A"
    background-colour: "#2F7A4A"
  error:
    icon: error
    primary-colour: "#D72D2A"
    background-colour: "#D72D2A"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:Inter:400"
font-heading: "bunny:Inter:800"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.65      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 78em
nav-width: 20em
