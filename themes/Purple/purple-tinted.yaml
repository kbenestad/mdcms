# mdcms theme v0.6.0
# mdcms theme — purple · tinted
# Colour-tinted background and nav. Calm, monochromatic, brand-forward.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#7C3AED"
    surface: "#EAE3FB"
    page: "#FAF8FF"
    ink: "#1A1A1A"
    ink-muted: "#5E5E66"
  dark:
    primary: "#C4B5FD"
    surface: "#1B1530"
    page: "#100B1F"
    ink: "#F1EFEC"
    ink-muted: "#9C9A95"
    on-surface: "#E2E2E2"
    on-surface-active: "#C4B5FD"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "#9A9A9A"
    on-surface-note: "#9A9A9A"
    on-surface-icon: "#9A9A9A"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#7C3AED"
  warning: "#B26A1F"
  success: "#2F7A4A"
  error: "#C13030"

colours-semantic-dark:
  info: "#9C69F1"
  warning: "#E7AF74"
  success: "#89D2A3"
  error: "#DE7C7C"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#7C3AED"
    background-colour: "#7C3AED"
  warning:
    icon: warning
    primary-colour: "#B26A1F"
    background-colour: "#B26A1F"
  success:
    icon: success
    primary-colour: "#2F7A4A"
    background-colour: "#2F7A4A"
  error:
    icon: error
    primary-colour: "#C13030"
    background-colour: "#C13030"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:IBM Plex Sans:300"
font-heading: "bunny:IBM Plex Sans:600"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
