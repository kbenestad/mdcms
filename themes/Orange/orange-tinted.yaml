# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — orange · tinted
# Colour-tinted background and nav. Calm, monochromatic, brand-forward.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#EA580C"
    surface: "#FBE2CC"
    page: "#FFF8F2"
    ink: "#1A1A1A"
    ink-muted: "#5E5E66"
    on-surface: "#1A1A1A"
    on-surface-active: "#1A1A1A"
    on-surface-title: "#1A1A1A"
    on-surface-heading: "#5E5E66"
    on-surface-note: "#5E5E66"
    on-surface-icon: "#5E5E66"
  dark:
    primary: "#FB923C"
    surface: "#241710"
    page: "#1A0F08"
    ink: "#F1EFEC"
    ink-muted: "#9C9A95"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#2B5797"
  warning: "#EA580C"
  success: "#2F7A4A"
  error: "#B33A2A"

colours-semantic-dark:
  info: "#80A5DB"
  warning: "#F79664"
  success: "#89D2A3"
  error: "#E0877B"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#2B5797"
    background-colour: "#2B5797"
  warning:
    icon: warning
    primary-colour: "#EA580C"
    background-colour: "#EA580C"
  success:
    icon: success
    primary-colour: "#2F7A4A"
    background-colour: "#2F7A4A"
  error:
    icon: error
    primary-colour: "#B33A2A"
    background-colour: "#B33A2A"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:IBM Plex Sans:300"
font-heading: "bunny:IBM Plex Sans:600"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
