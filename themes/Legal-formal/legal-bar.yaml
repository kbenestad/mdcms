# mdcms theme v0.6.0
# mdcms theme — legal · bar
# Burgundy on ivory. Slightly warmer than Counsel — chambers, not courtroom.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#7A2030"
    surface: "#F0E5D8"
    page: "#FBF6F0"
    ink: "#1A1410"
    ink-muted: "#6E5C4A"
  dark:
    primary: "#D85068"
    surface: "#251510"
    page: "#1A0F0C"
    ink: "#F0E5D8"
    ink-muted: "#A89080"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#2A4A8F"
  warning: "#8B5A00"
  success: "#3F6B3C"
  error: "#7A2030"

colours-semantic-dark:
  info: "#819DDA"
  warning: "#FFC55C"
  success: "#8DD289"
  error: "#DD7E8F"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#2A4A8F"
    background-colour: "#2A4A8F"
  warning:
    icon: warning
    primary-colour: "#8B5A00"
    background-colour: "#8B5A00"
  success:
    icon: success
    primary-colour: "#3F6B3C"
    background-colour: "#3F6B3C"
  error:
    icon: error
    primary-colour: "#7A2030"
    background-colour: "#7A2030"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:EB Garamond:500"
font-heading: "bunny:EB Garamond:700"
font-size: 1.10        # unitless multiplier (1.0 = 16px base)
line-height: 1.65      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
