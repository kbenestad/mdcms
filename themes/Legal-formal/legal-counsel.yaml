# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — legal · counsel
# Oxblood on cream, EB Garamond throughout. Traditional and authoritative.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#5B0F1F"
    surface: "#EFE3CB"
    page: "#FAF5EC"
    ink: "#1A1410"
    ink-muted: "#6E5C4A"
  dark:
    primary: "#C04A5A"
    surface: "#251A12"
    page: "#1A100A"
    ink: "#F0E5D0"
    ink-muted: "#A8907A"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#2A4A8F"
  warning: "#8B5A00"
  success: "#3F6B3C"
  error: "#5B0F1F"

colours-semantic-dark:
  info: "#819DDA"
  warning: "#FFC55C"
  success: "#8DD289"
  error: "#E8738C"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#2A4A8F"
    background-colour: "#2A4A8F"
  warning:
    icon: warning
    primary-colour: "#8B5A00"
    background-colour: "#8B5A00"
  success:
    icon: success
    primary-colour: "#3F6B3C"
    background-colour: "#3F6B3C"
  error:
    icon: error
    primary-colour: "#5B0F1F"
    background-colour: "#5B0F1F"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:EB Garamond:500"
font-heading: "bunny:EB Garamond:700"
font-size: 1.10        # unitless multiplier (1.0 = 16px base)
line-height: 1.65      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
