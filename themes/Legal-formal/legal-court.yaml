# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — legal · court
# Judicial brass on charcoal nav. Serif heads with sans body — formal but legible.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#8B6F1E"
    surface: "#2A2A24"
    page: "#FAFAF6"
    ink: "#1A1A14"
    ink-muted: "#5C5C56"
    on-surface: "#E2E2E2"
    on-surface-active: "#8B6F1E"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "#9A9A9A"
    on-surface-note: "#9A9A9A"
    on-surface-icon: "#9A9A9A"
  dark:
    primary: "#D8B048"
    surface: "#1A1A14"
    page: "#0A0A08"
    ink: "#F0F0E8"
    ink-muted: "#A8A89A"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#2A4A8F"
  warning: "#8B6F1E"
  success: "#3F6B3C"
  error: "#9C3A2A"

colours-semantic-dark:
  info: "#819DDA"
  warning: "#E2C779"
  success: "#8DD289"
  error: "#DC8C7E"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#2A4A8F"
    background-colour: "#2A4A8F"
  warning:
    icon: warning
    primary-colour: "#8B6F1E"
    background-colour: "#8B6F1E"
  success:
    icon: success
    primary-colour: "#3F6B3C"
    background-colour: "#3F6B3C"
  error:
    icon: error
    primary-colour: "#9C3A2A"
    background-colour: "#9C3A2A"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:Public Sans:400"
font-heading: "bunny:EB Garamond:700"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
