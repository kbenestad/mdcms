# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — gov · civic
# USWDS-style civic palette — restrained navy and red on cool gray.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#112E51"
    surface: "#F0F0F0"
    page: "#FFFFFF"
    ink: "#1B1B1B"
    ink-muted: "#5C5C5C"
  dark:
    primary: "#5A9AD8"
    surface: "#112E51"
    page: "#0E1A2E"
    ink: "#F0F0F0"
    ink-muted: "#A8B0BC"
    on-surface: "rgba(255,255,255,0.92)"
    on-surface-active: "#112E51"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "rgba(255,255,255,0.65)"
    on-surface-note: "rgba(255,255,255,0.70)"
    on-surface-icon: "rgba(255,255,255,0.70)"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#112E51"
  warning: "#BE7E2C"
  success: "#2E8540"
  error: "#BE2C2C"

colours-semantic-dark:
  info: "#78A8E3"
  warning: "#E0B47A"
  success: "#86D596"
  error: "#E07A7A"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#112E51"
    background-colour: "#112E51"
  warning:
    icon: warning
    primary-colour: "#BE7E2C"
    background-colour: "#BE7E2C"
  success:
    icon: success
    primary-colour: "#2E8540"
    background-colour: "#2E8540"
  error:
    icon: error
    primary-colour: "#BE2C2C"
    background-colour: "#BE2C2C"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:Public Sans:400"
font-heading: "bunny:Public Sans:700"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.65      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
