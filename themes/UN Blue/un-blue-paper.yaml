# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — un blue · paper
# White paper, neutral chrome. Colour used as a confident accent.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#5B92E5"
    surface: "#F4F5F8"
    page: "#FFFFFF"
    ink: "#15161B"
    ink-muted: "#5C5F6E"
    on-surface: "#15161B"
    on-surface-active: "#1A1A1A"
    on-surface-title: "#15161B"
    on-surface-heading: "#5C5F6E"
    on-surface-note: "#5C5F6E"
    on-surface-icon: "#5C5F6E"
  dark:
    primary: "#9EC2F0"
    surface: "#15171C"
    page: "#0B0C10"
    ink: "#ECEDF1"
    ink-muted: "#8E919C"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#5B92E5"
  warning: "#B26A1F"
  success: "#2F7A4A"
  error: "#C13030"

colours-semantic-dark:
  info: "#72A1E9"
  warning: "#E7AF74"
  success: "#89D2A3"
  error: "#DE7C7C"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#5B92E5"
    background-colour: "#5B92E5"
  warning:
    icon: warning
    primary-colour: "#B26A1F"
    background-colour: "#B26A1F"
  success:
    icon: success
    primary-colour: "#2F7A4A"
    background-colour: "#2F7A4A"
  error:
    icon: error
    primary-colour: "#C13030"
    background-colour: "#C13030"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:IBM Plex Sans:300"
font-heading: "bunny:IBM Plex Sans:600"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
