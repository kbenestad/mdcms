# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — un blue · bold
# UN sky-blue sidebar with deeper blue content accent. Multilateral, full strength.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#1A4E8A"
    surface: "#5B92E5"
    page: "#FFFFFF"
    ink: "#0F1B30"
    ink-muted: "#5C6E94"
    on-surface: "var(--font-colour)"
    on-surface-active: "var(--font-colour)"
    on-surface-title: "var(--nav-link-colour)"
    on-surface-heading: "var(--font-colour)"
    on-surface-note: "var(--font-colour)"
    on-surface-icon: "var(--font-colour)"
  dark:
    primary: "#9EC2F0"
    surface: "#0F2B4A"
    page: "#0A1828"
    ink: "#FFFFFF"
    ink-muted: "#A8C4E0"
    on-surface: "rgba(255,255,255,0.92)"
    on-surface-active: "#9EC2F0"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "rgba(255,255,255,0.65)"
    on-surface-note: "rgba(255,255,255,0.70)"
    on-surface-icon: "rgba(255,255,255,0.70)"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#5B92E5"
  warning: "#B26A1F"
  success: "#2F7A4A"
  error: "#C13030"

colours-semantic-dark:
  info: "#72A1E9"
  warning: "#E7AF74"
  success: "#89D2A3"
  error: "#DE7C7C"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#5B92E5"
    background-colour: "#5B92E5"
  warning:
    icon: warning
    primary-colour: "#B26A1F"
    background-colour: "#B26A1F"
  success:
    icon: success
    primary-colour: "#2F7A4A"
    background-colour: "#2F7A4A"
  error:
    icon: error
    primary-colour: "#C13030"
    background-colour: "#C13030"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:IBM Plex Sans:300"
font-heading: "bunny:IBM Plex Sans:600"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
