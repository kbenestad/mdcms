# mdcms theme v0.6.0
# mdcms theme — south africa · bold
# Six-colour palette — emerald accent, gold highlight, black sidebar.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#007749"
    surface: "#000000"
    page: "#FFFFFF"
    ink: "#1A1A1A"
    ink-muted: "#5C5C5C"
    on-surface: "#E2E2E2"
    on-surface-active: "#007749"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "var(--nav-link-colour)"
    on-surface-note: "var(--nav-link-colour)"
    on-surface-icon: "var(--nav-link-colour)"
  dark:
    primary: "#FFB81C"
    surface: "#000000"
    page: "#0A1A12"
    ink: "#FFFFFF"
    ink-muted: "#A8B0A8"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#2B5797"
  warning: "#B26A1F"
  success: "#2F7A4A"
  error: "#C13030"

colours-semantic-dark:
  info: "#80A5DB"
  warning: "#E7AF74"
  success: "#89D2A3"
  error: "#DE7C7C"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#2B5797"
    background-colour: "#2B5797"
  warning:
    icon: warning
    primary-colour: "#B26A1F"
    background-colour: "#B26A1F"
  success:
    icon: success
    primary-colour: "#2F7A4A"
    background-colour: "#2F7A4A"
  error:
    icon: error
    primary-colour: "#C13030"
    background-colour: "#C13030"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:IBM Plex Sans:300"
font-heading: "bunny:IBM Plex Sans:600"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
