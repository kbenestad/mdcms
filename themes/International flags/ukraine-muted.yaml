# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — ukraine · muted
# Wheat-field gold and cornflower blue, softened.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
light:
  accent: "#2A6BAA"
  background: "#FBFAF3"
  nav-background: "#F0E5B8"
  text: "#1F2D44"
  text-muted: "#6E7588"
  nav-link: "#1F2D44"
  nav-link-active: "#1D4B77"
  nav-section-heading: "#6E7588"
  nav-sitename: "#1F2D44"
  nav-description: "#6E7588"
  nav-toggle: "#6E7588"

dark:
  accent: "#D8C158"
  background: "#0E1622"
  nav-background: "#1A2030"
  text: "#EAEDF2"
  text-muted: "#A89E70"

# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#2B5797"
  warning: "#B26A1F"
  success: "#2F7A4A"
  error: "#C13030"

colours-semantic-dark:
  info: "#80A5DB"
  warning: "#E7AF74"
  success: "#89D2A3"
  error: "#DE7C7C"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#2B5797"
    background-colour: "#2B5797"
  warning:
    icon: warning
    primary-colour: "#B26A1F"
    background-colour: "#B26A1F"
  success:
    icon: success
    primary-colour: "#2F7A4A"
    background-colour: "#2F7A4A"
  error:
    icon: error
    primary-colour: "#C13030"
    background-colour: "#C13030"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:IBM Plex Sans:300"
font-heading: "bunny:IBM Plex Sans:600"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
