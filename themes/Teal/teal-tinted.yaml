# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — teal · tinted
# Colour-tinted background and nav. Calm, monochromatic, brand-forward.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#0D9488"
    surface: "#D6F1EC"
    page: "#F2FCFA"
    ink: "#1A1A1A"
    ink-muted: "#5E5E66"
  dark:
    primary: "#2DD4BF"
    surface: "#0F211D"
    page: "#0A1614"
    ink: "#F1EFEC"
    ink-muted: "#9C9A95"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#2B5797"
  warning: "#B26A1F"
  success: "#0D9488"
  error: "#C13030"

colours-semantic-dark:
  info: "#80A5DB"
  warning: "#E7AF74"
  success: "#69F2E6"
  error: "#DE7C7C"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#2B5797"
    background-colour: "#2B5797"
  warning:
    icon: warning
    primary-colour: "#B26A1F"
    background-colour: "#B26A1F"
  success:
    icon: success
    primary-colour: "#0D9488"
    background-colour: "#0D9488"
  error:
    icon: error
    primary-colour: "#C13030"
    background-colour: "#C13030"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:IBM Plex Sans:300"
font-heading: "bunny:IBM Plex Sans:600"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
