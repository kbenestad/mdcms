# mdcms theme v0.6.0
# mdcms theme — terminal · vt100
# 1970s DEC VT100 amber phosphor. The terminal of every documentary about the early internet.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#7A3F00"
    surface: "#F0DBA0"
    page: "#FAF0D8"
    ink: "#2A1A0A"
    ink-muted: "#6E5A40"
    on-surface: "rgba(0,0,0,0.85)"
    on-surface-active: "#7A3F00"
    on-surface-title: "#000000"
    on-surface-heading: "rgba(0,0,0,0.60)"
    on-surface-note: "rgba(0,0,0,0.65)"
    on-surface-icon: "rgba(0,0,0,0.65)"
  dark:
    primary: "#FFB000"
    surface: "#2A1A00"
    page: "#180D00"
    ink: "#FFB000"
    ink-muted: "#B07A00"
    on-surface: "#E2E2E2"
    on-surface-active: "#FFB000"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "#9A9A9A"
    on-surface-note: "#9A9A9A"
    on-surface-icon: "#9A9A9A"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#5BC0FF"
  warning: "#FFB000"
  success: "#80FF40"
  error: "#FF5040"

colours-semantic-dark:
  info: "#5CC0FF"
  warning: "#FFB000"
  success: "#80FF40"
  error: "#FF695C"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#5BC0FF"
    background-colour: "#5BC0FF"
  warning:
    icon: warning
    primary-colour: "#FFB000"
    background-colour: "#FFB000"
  success:
    icon: success
    primary-colour: "#80FF40"
    background-colour: "#80FF40"
  error:
    icon: error
    primary-colour: "#FF5040"
    background-colour: "#FF5040"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# Sixtyfour's built-in phosphor-bleed glyph shapes read as CRT glow at
# heading size; IBM Plex Mono keeps paragraphs legible at length.
# ──────────────────────────────────
font-body: "bunny:IBM Plex Mono:400"
font-heading: "google:Sixtyfour:400"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.60      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em

# ──────────────────────────────────
# Effects
# ──────────────────────────────────
scanlines: yes
