# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — terminal · teletype
# 1950s Selectric typebar — navy ink on ivory paper. Office of Records, mid-century.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#1F2D5C"
    surface: "#E6D9B0"
    page: "#F4ECD8"
    ink: "#1A1612"
    ink-muted: "#6E5E40"
    on-surface: "rgba(0,0,0,0.85)"
    on-surface-active: "#1F2D5C"
    on-surface-title: "#000000"
    on-surface-heading: "rgba(0,0,0,0.60)"
    on-surface-note: "rgba(0,0,0,0.65)"
    on-surface-icon: "rgba(0,0,0,0.65)"
  dark:
    primary: "#E8D7A0"
    surface: "#1F1A0E"
    page: "#14110A"
    ink: "#F5E8C8"
    ink-muted: "#A89880"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#1F2D5C"
  warning: "#8B5A00"
  success: "#3F6B3C"
  error: "#9C3A2A"

colours-semantic-dark:
  info: "#8598D6"
  warning: "#FFC55C"
  success: "#8DD289"
  error: "#DC8C7E"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#1F2D5C"
    background-colour: "#1F2D5C"
  warning:
    icon: warning
    primary-colour: "#8B5A00"
    background-colour: "#8B5A00"
  success:
    icon: success
    primary-colour: "#3F6B3C"
    background-colour: "#3F6B3C"
  error:
    icon: error
    primary-colour: "#9C3A2A"
    background-colour: "#9C3A2A"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:IBM Plex Mono:400"
font-heading: "bunny:IBM Plex Mono:600"
font-size: 0.95        # unitless multiplier (1.0 = 16px base)
line-height: 1.75      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
