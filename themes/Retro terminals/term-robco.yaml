# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — terminal · robco
# RobCo Industries Unified Operating System. The Pip-Boy green you boot up in a vault.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#00532D"
    surface: "#2A1F12"
    page: "#F4ECCB"
    ink: "#1F2A1F"
    ink-muted: "#5A7058"
    on-surface: "#E2E2E2"
    on-surface-active: "#FFFFFF"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "#9A9A9A"
    on-surface-note: "#9A9A9A"
    on-surface-icon: "#9A9A9A"
  dark:
    primary: "#1AFF6A"
    surface: "#000F06"
    page: "#040A06"
    ink: "#1AFF6A"
    ink-muted: "#1AAA4A"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#1AFF6A"
  warning: "#FFB800"
  success: "#1AFF6A"
  error: "#FF3333"

colours-semantic-dark:
  info: "#1AFF6A"
  warning: "#FFB800"
  success: "#1AFF6A"
  error: "#FF5C5C"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#1AFF6A"
    background-colour: "#1AFF6A"
  warning:
    icon: warning
    primary-colour: "#FFB800"
    background-colour: "#FFB800"
  success:
    icon: success
    primary-colour: "#1AFF6A"
    background-colour: "#1AFF6A"
  error:
    icon: error
    primary-colour: "#FF3333"
    background-colour: "#FF3333"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "google:VT323:400"
font-heading: "google:VT323:400"
font-size: 1.30        # unitless multiplier (1.0 = 16px base)
line-height: 1.55      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
