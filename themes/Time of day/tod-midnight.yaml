# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — time · midnight
# Deep navy starfield. Quiet, focused, after-hours.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
light:
  accent: "#1A2658"
  background: "#F2F4FB"
  nav-background: "#DCE3F2"
  text: "#0A1230"
  text-muted: "#5C6E96"

dark:
  accent: "#6080C8"
  background: "#000814"
  nav-background: "#00112E"
  text: "#E0E8F8"
  text-muted: "#8090C0"
  nav-link: "#E2E2E2"
  nav-link-active: "#6080C8"
  nav-section-heading: "#9A9A9A"
  nav-sitename: "#FFFFFF"
  nav-description: "#9A9A9A"
  nav-toggle: "#9A9A9A"

# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#1A2658"
  warning: "#B26A1F"
  success: "#2F7A4A"
  error: "#9C3A4A"

colours-semantic-dark:
  info: "#8192DA"
  warning: "#E7AF74"
  success: "#89D2A3"
  error: "#D38894"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#1A2658"
    background-colour: "#1A2658"
  warning:
    icon: warning
    primary-colour: "#B26A1F"
    background-colour: "#B26A1F"
  success:
    icon: success
    primary-colour: "#2F7A4A"
    background-colour: "#2F7A4A"
  error:
    icon: error
    primary-colour: "#9C3A4A"
    background-colour: "#9C3A4A"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:Manrope:400"
font-heading: "bunny:Manrope:700"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
