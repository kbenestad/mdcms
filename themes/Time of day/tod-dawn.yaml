# mdcms theme v0.6.0
# mdcms theme — time · dawn
# Pre-sunrise pale apricot and coral. Soft, warm, hopeful.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#D87B5A"
    surface: "#FBE5D5"
    page: "#FFF6EE"
    ink: "#3A2A20"
    ink-muted: "#8A6F5E"
    on-surface: "#3A2A20"
    on-surface-active: "#1A1A1A"
    on-surface-title: "#3A2A20"
    on-surface-heading: "#8A6F5E"
    on-surface-note: "#8A6F5E"
    on-surface-icon: "#8A6F5E"
  dark:
    primary: "#FFA078"
    surface: "#261A12"
    page: "#1A140E"
    ink: "#F0E0D0"
    ink-muted: "#B89580"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#5A7AB8"
  warning: "#D87B5A"
  success: "#5A8A5A"
  error: "#B85040"

colours-semantic-dark:
  info: "#89A2D2"
  warning: "#E0957B"
  success: "#89D289"
  error: "#D59086"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#5A7AB8"
    background-colour: "#5A7AB8"
  warning:
    icon: warning
    primary-colour: "#D87B5A"
    background-colour: "#D87B5A"
  success:
    icon: success
    primary-colour: "#5A8A5A"
    background-colour: "#5A8A5A"
  error:
    icon: error
    primary-colour: "#B85040"
    background-colour: "#B85040"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:Manrope:400"
font-heading: "bunny:Manrope:700"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
