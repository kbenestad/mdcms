# mdcms theme v0.6.0
# mdcms theme — medical · wellness · bold
# Sage sidebar on cream. Holistic and grounded — for therapy and wellness practices.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#5A7A5A"
    surface: "#5A7A5A"
    page: "#F8F8F2"
    ink: "#1F2A1F"
    ink-muted: "#6E7E6E"
    on-surface: "#E2E2E2"
    on-surface-active: "#FFFFFF"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "var(--nav-link-colour)"
    on-surface-note: "var(--nav-link-colour)"
    on-surface-icon: "var(--nav-link-colour)"
  dark:
    primary: "#88B088"
    surface: "#142014"
    page: "#0F140C"
    ink: "#FFFFFF"
    ink-muted: "#A8C0A8"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#5A7AB8"
  warning: "#B58A1A"
  success: "#5A7A5A"
  error: "#A0506A"

colours-semantic-dark:
  info: "#89A2D2"
  warning: "#EBC970"
  success: "#89D289"
  error: "#D289A1"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#5A7AB8"
    background-colour: "#5A7AB8"
  warning:
    icon: warning
    primary-colour: "#B58A1A"
    background-colour: "#B58A1A"
  success:
    icon: success
    primary-colour: "#5A7A5A"
    background-colour: "#5A7A5A"
  error:
    icon: error
    primary-colour: "#A0506A"
    background-colour: "#A0506A"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:IBM Plex Sans:400"
font-heading: "bunny:IBM Plex Sans:600"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
