# mdcms theme v0.6.0
# mdcms theme — medical · pharmacy
# Pharmacy navy and white. Trustworthy and traditional.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#1A4E8A"
    surface: "#EAF0F8"
    page: "#FFFFFF"
    ink: "#14213D"
    ink-muted: "#5C6E88"
  dark:
    primary: "#4A88D8"
    surface: "#131A2E"
    page: "#0A0F1A"
    ink: "#E8EDF4"
    ink-muted: "#8AA0C0"
    on-surface: "#E2E2E2"
    on-surface-active: "#4A88D8"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "#9A9A9A"
    on-surface-note: "#9A9A9A"
    on-surface-icon: "#9A9A9A"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#1A4E8A"
  warning: "#B26A1F"
  success: "#2F8A4A"
  error: "#C13030"

colours-semantic-dark:
  info: "#76A9E5"
  warning: "#E7AF74"
  success: "#85D69D"
  error: "#DE7C7C"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#1A4E8A"
    background-colour: "#1A4E8A"
  warning:
    icon: warning
    primary-colour: "#B26A1F"
    background-colour: "#B26A1F"
  success:
    icon: success
    primary-colour: "#2F8A4A"
    background-colour: "#2F8A4A"
  error:
    icon: error
    primary-colour: "#C13030"
    background-colour: "#C13030"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:IBM Plex Sans:400"
font-heading: "bunny:IBM Plex Sans:600"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.65      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
