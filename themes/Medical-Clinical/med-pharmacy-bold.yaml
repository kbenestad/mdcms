# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — medical · pharmacy · bold
# Pharmacy navy as the sidebar itself. Authoritative, traditional, trusted.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
light:
  accent: "#1A4E8A"
  background: "#FFFFFF"
  nav-background: "#1A4E8A"
  text: "#14213D"
  text-muted: "#5C6E88"
  nav-link: "rgba(255,255,255,0.92)"
  nav-link-active: "#FFFFFF"
  nav-section-heading: "rgba(255,255,255,0.65)"
  nav-sitename: "#FFFFFF"
  nav-description: "rgba(255,255,255,0.70)"
  nav-toggle: "rgba(255,255,255,0.70)"

dark:
  accent: "#4A88D8"
  background: "#0A0F1A"
  nav-background: "#06182E"
  text: "#FFFFFF"
  text-muted: "#9EBADC"
  nav-link: "#E2E2E2"
  nav-link-active: "#4A88D8"
  nav-section-heading: "#9A9A9A"
  nav-sitename: "#FFFFFF"
  nav-description: "#9A9A9A"
  nav-toggle: "#9A9A9A"

# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#1A4E8A"
  warning: "#B26A1F"
  success: "#2F8A4A"
  error: "#C13030"

colours-semantic-dark:
  info: "#76A9E5"
  warning: "#E7AF74"
  success: "#85D69D"
  error: "#DE7C7C"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#1A4E8A"
    background-colour: "#1A4E8A"
  warning:
    icon: warning
    primary-colour: "#B26A1F"
    background-colour: "#B26A1F"
  success:
    icon: success
    primary-colour: "#2F8A4A"
    background-colour: "#2F8A4A"
  error:
    icon: error
    primary-colour: "#C13030"
    background-colour: "#C13030"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:IBM Plex Sans:400"
font-heading: "bunny:IBM Plex Sans:600"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.65      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
