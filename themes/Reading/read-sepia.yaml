# mdcms theme v0.6.0
# mdcms theme — reading · sepia
# Warm cream and sienna. Comfortable for hours — Kindle-style sepia.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#8B4513"
    surface: "#EAD9B0"
    page: "#F4ECD8"
    ink: "#3A2A1A"
    ink-muted: "#6E5C40"
    on-surface: "rgba(255,255,255,0.92)"
    on-surface-active: "#8B4513"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "rgba(255,255,255,0.65)"
    on-surface-note: "rgba(255,255,255,0.70)"
    on-surface-icon: "rgba(255,255,255,0.70)"
  dark:
    primary: "#D8A878"
    surface: "#2A1F15"
    page: "#1F1810"
    ink: "#E8D8B8"
    ink-muted: "#A8957A"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#5A4A8F"
  warning: "#8B5A00"
  success: "#3F6B3C"
  error: "#9C3A2A"

colours-semantic-dark:
  info: "#9A89D2"
  warning: "#FFC55C"
  success: "#8DD289"
  error: "#DC8C7E"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#5A4A8F"
    background-colour: "#5A4A8F"
  warning:
    icon: warning
    primary-colour: "#8B5A00"
    background-colour: "#8B5A00"
  success:
    icon: success
    primary-colour: "#3F6B3C"
    background-colour: "#3F6B3C"
  error:
    icon: error
    primary-colour: "#9C3A2A"
    background-colour: "#9C3A2A"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:Lora:400"
font-heading: "bunny:Lora:600"
font-size: 1.05        # unitless multiplier (1.0 = 16px base)
line-height: 1.75      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
