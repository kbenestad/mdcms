# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — icelandair · muted
# Glacier blue alone — North-Atlantic restraint.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
palette:
  light:
    primary: "#2A6BAA"
    surface: "#DDE5EE"
    page: "#FBFCFE"
    ink: "#0F2438"
    ink-muted: "#6E7894"
  dark:
    primary: "#88B0DC"
    surface: "#0E2238"
    page: "#0A1828"
    ink: "#E8EFF4"
    ink-muted: "#909AAC"
    on-surface: "#E2E2E2"
    on-surface-active: "#88B0DC"
    on-surface-title: "#FFFFFF"
    on-surface-heading: "#9A9A9A"
    on-surface-note: "#9A9A9A"
    on-surface-icon: "#9A9A9A"


# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#2B5797"
  warning: "#B26A1F"
  success: "#2F7A4A"
  error: "#C13030"

colours-semantic-dark:
  info: "#80A5DB"
  warning: "#E7AF74"
  success: "#89D2A3"
  error: "#DE7C7C"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#2B5797"
    background-colour: "#2B5797"
  warning:
    icon: warning
    primary-colour: "#B26A1F"
    background-colour: "#B26A1F"
  success:
    icon: success
    primary-colour: "#2F7A4A"
    background-colour: "#2F7A4A"
  error:
    icon: error
    primary-colour: "#C13030"
    background-colour: "#C13030"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:IBM Plex Sans:300"
font-heading: "bunny:IBM Plex Sans:600"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
