# mdcms v0.4 | DO NOT REMOVE THIS COMMENT
# mdcms theme — norge · festive
# Red-tinted nav with navy accent. Celebratory, parade-day energy.

# ──────────────────────────────────
# Colours
# ──────────────────────────────────
light:
  accent: "#00205B"
  background: "#FFFFFF"
  nav-background: "#FBE2E6"
  text: "#00205B"
  text-muted: "#6E7794"

dark:
  accent: "#BA0C2F"
  background: "#00205B"
  nav-background: "#3A0810"
  text: "#FFFFFF"
  text-muted: "#9DB1E0"
  nav-link: "#E2E2E2"
  nav-link-active: "#00205B"
  nav-section-heading: "#9A9A9A"
  nav-sitename: "#FFFFFF"
  nav-description: "#9A9A9A"
  nav-toggle: "#9A9A9A"

# ──────────────────────────────────
# Semantic colours
# colours-semantic applies to both modes.
# colours-semantic-dark overrides for dark mode only.
# ──────────────────────────────────
colours-semantic:
  info: "#00205B"
  warning: "#B26A1F"
  success: "#2F7A4A"
  error: "#BA0C2F"

colours-semantic-dark:
  info: "#5C95FF"
  warning: "#E7AF74"
  success: "#89D2A3"
  error: "#F56683"

# ──────────────────────────────────
# Callout defaults
# primary-colour matches colours-semantic (light mode).
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#00205B"
    background-colour: "#00205B"
  warning:
    icon: warning
    primary-colour: "#B26A1F"
    background-colour: "#B26A1F"
  success:
    icon: success
    primary-colour: "#2F7A4A"
    background-colour: "#2F7A4A"
  error:
    icon: error
    primary-colour: "#BA0C2F"
    background-colour: "#BA0C2F"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:IBM Plex Sans:300"
font-heading: "bunny:IBM Plex Sans:600"
font-size: 1.00        # unitless multiplier (1.0 = 16px base)
line-height: 1.70      # unitless multiplier

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
