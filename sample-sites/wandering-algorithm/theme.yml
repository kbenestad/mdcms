# mdcms theme v0.6.0
# mdcms theme — The Wandering Algorithm
palette:
  light:
    primary: "#4A5568"
    surface: "#F2F0EB"
    page: "#FAFAF8"
    ink: "#2D3748"
    ink-muted: "#718096"
  dark:
    primary: "#9F7AEA"
    surface: "#161B22"
    page: "#0D1117"
    ink: "#E6EDF3"
    ink-muted: "#8B949E"


colours-semantic:
  info: "#4299E1"
  warning: "#ECC94B"
  success: "#48BB78"
  error: "#FC8181"

callouts:
  info:
    icon: info
    primary-colour: "#4299E1"
    background-colour: "#4299E1"
  warning:
    icon: warning
    primary-colour: "#ECC94B"
    background-colour: "#ECC94B"
  success:
    icon: success
    primary-colour: "#48BB78"
    background-colour: "#48BB78"
  error:
    icon: error
    primary-colour: "#FC8181"
    background-colour: "#FC8181"

font-body: "bunny:Lora:400"
font-heading: "bunny:Playfair Display:700"
font-size: 1.05
line-height: 1.8

main-width: 70em
nav-width: 18em
