# mdcms theme v0.6.0
# mdcms theme — The Kitchen Table
palette:
  light:
    primary: "#B7410E"
    surface: "#FFF8EE"
    page: "#FFFDF7"
    ink: "#2D2016"
    ink-muted: "#8B6914"
  dark:
    primary: "#F59E0B"
    surface: "#241910"
    page: "#1C1208"
    ink: "#FEF3C7"
    ink-muted: "#D97706"


colours-semantic:
  info: "#2563EB"
  warning: "#D97706"
  success: "#16A34A"
  error: "#DC2626"

callouts:
  info:
    icon: info
    primary-colour: "#2563EB"
    background-colour: "#2563EB"
  warning:
    icon: warning
    primary-colour: "#D97706"
    background-colour: "#D97706"
  success:
    icon: success
    primary-colour: "#16A34A"
    background-colour: "#16A34A"
  error:
    icon: error
    primary-colour: "#DC2626"
    background-colour: "#DC2626"

font-body: "bunny:Merriweather:400"
font-heading: "bunny:Playfair Display:700"
font-size: 1.0
line-height: 1.8

main-width: 72em
nav-width: 18em
