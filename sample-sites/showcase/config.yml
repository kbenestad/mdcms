# mdcms v0.6.0 | DO NOT REMOVE THIS COMMENT
# MD-CMS Feature Showcase — a topbar site exercising the v0.6 renderer.
sitename: MD-CMS Showcase
sitedescription: A guided tour of the MD-CMS renderer — topbar navigation, callouts, tabs, accordions, TOC, posts, nested sections and categories.
navigation: topbar
theme: theme.yml
search: true
default-theme: system
footer: "Built with **MD-CMS** · content and themes are in the public domain (CC0)."

# ──────────────────────────────────
# Categories — a language switcher with two variants.
# `en` is the default (files with no suffix: home.md, about.md, ...).
# `nb` is Norwegian (files with a .nb.md suffix: home.nb.md, ...).
# See pages/categories.md for a guided tour of this block.
# ──────────────────────────────────
categories-use: yes
default-category:
  code: en
  name: English
  direction: ltr
categories:
  - code: nb
    name: Norsk
    direction: ltr
    visibilityifnocontent: visible
    pagenotfoundmessage: "Denne siden finnes ikke på norsk ennå — men strukturen er den samme."
categories-sectionnames: same
categories-selecticon: language
categories-selecttext: "Language"

callouts:
  preview:
    type: info
    en:
      title: "Live theme preview"
      text: This page can be re-skinned on the fly. Open it from the sample-site picker and choose any theme to see the same content in a different palette.
  beta:
    type: warning
    en:
      title: "Config-sourced message"
      text: "This callout's title and body came from the `callouts.beta` block in `config.yml`, not from the markdown you're reading — the tag only says `message: beta`."
    nb:
      title: "Melding fra config.yml"
      text: Denne meldingen kommer fra `callouts.beta` i `config.yml`, ikke fra selve markdown-filen.
  translation:
    type: info
    en:
      title: "About this translation"
      text: This Norwegian page is a short, hand-written excerpt for the demo — not machine translated.
    nb:
      title: "Om denne oversettelsen"
      text: Denne siden er et kort utdrag skrevet for hånd til demoen — ikke maskinoversatt.
