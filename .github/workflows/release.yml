name: Release binaries

# Builds standalone mdcms binaries for every supported platform and lands them
# in latest/ on main, so the raw.githubusercontent.com/.../main/latest/... URLs
# documented in install.md always serve the newest build. When triggered by a
# version tag (v*), it additionally publishes a GitHub release with the same
# binaries attached under descriptive names.
#
# Targets:
#   linux/amd64   — ubuntu-22.04            (binary + .deb)
#   linux/arm64   — ubuntu-22.04-arm        (binary + .deb)   ← Raspberry Pi 3/4/5 (64-bit OS)
#   macos/silicon — macos-14 (arm64)        (binary)          ← Apple Silicon
#   macos/intel   — macos-15-intel (x86_64) (binary)          ← Intel Macs (own job, see below)
#   windows       — windows-latest          (mdcms.exe)
#
# The Linux jobs run on 22.04 (glibc 2.35) rather than the newest runner so the
# binaries also run on older-glibc systems — notably current Raspberry Pi OS /
# Debian 12 (glibc 2.36). A binary built on a newer glibc will not run there.
#
# The macOS Intel build is deliberately OUTSIDE the build matrix: Intel runner
# capacity is scarce (macos-13 was retired December 2025; macos-15-intel is the
# last Intel image, supported until Fall 2027) and the job can sit queued long
# after every other build has finished. It therefore has its own build job and
# its own publish-intel job, so `publish` — which commits latest/ and creates
# the GitHub release — only waits for the fast builds. publish-intel appends
# the Intel binary to latest/ and the release whenever it completes.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Opt into the Node.js 24 runner ahead of the June 2026 forced migration.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-22.04
            dest: linux/amd64
            relname: mdcms-linux-amd64
            deb: true
            deb_arch: amd64
          - target: linux-arm64
            runner: ubuntu-22.04-arm
            dest: linux/arm64
            relname: mdcms-linux-arm64
            deb: true
            deb_arch: arm64
          - target: macos-silicon
            runner: macos-14
            dest: macos/silicon
            relname: mdcms-macos-silicon
            deb: false
          - target: windows-amd64
            runner: windows-latest
            dest: windows
            relname: mdcms-windows-amd64
            deb: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # On a tagged release, stamp the tag's version into mdcms.py / pyproject /
      # config.yml / index.html *before* building, so the binary reports it and
      # the package metadata matches. Skipped on workflow_dispatch (which just
      # rebuilds latest/ from whatever is committed).
      - name: Apply release version from tag
        if: github.ref_type == 'tag'
        shell: bash
        run: python scripts/bump_version.py "${GITHUB_REF_NAME}"

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          VERSION=$(python -c "import re;print(re.search(r'version\s*=\s*\"([^\"]+)\"', open('pyproject.toml').read()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building mdcms $VERSION for ${{ matrix.target }}"

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install .

      - name: Build binary (PyInstaller)
        shell: bash
        run: |
          pyinstaller --onefile --name mdcms --collect-data certifi mdcms.py

      - name: Build .deb (fpm)
        if: matrix.deb
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm
          fpm -s dir -t deb \
            -n mdcms \
            -v "${{ steps.ver.outputs.version }}" \
            -a "${{ matrix.deb_arch }}" \
            --license "Apache-2.0" \
            --description "MD-CMS — Markdown-based CMS companion CLI" \
            --url "https://github.com/kbenestad/mdcms" \
            --maintainer "Kristian Benestad" \
            -p mdcms.deb \
            dist/mdcms=/usr/local/bin/mdcms

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p "out/latest/${{ matrix.dest }}" out/release
          if [ "${{ matrix.target }}" = "windows-amd64" ]; then
            cp dist/mdcms.exe "out/latest/${{ matrix.dest }}/mdcms.exe"
            cp dist/mdcms.exe "out/release/${{ matrix.relname }}.exe"
          else
            cp dist/mdcms "out/latest/${{ matrix.dest }}/mdcms"
            cp dist/mdcms "out/release/${{ matrix.relname }}"
          fi
          if [ "${{ matrix.deb }}" = "true" ]; then
            cp mdcms.deb "out/latest/${{ matrix.dest }}/mdcms.deb"
            cp mdcms.deb "out/release/${{ matrix.relname }}.deb"
          fi
          ls -R out

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: out
          if-no-files-found: error

  # macOS Intel is built outside the matrix so its (often long) runner queue
  # never delays `publish`. Its artifact name deliberately does NOT match the
  # dist-* pattern that `publish` downloads; `publish-intel` picks it up.
  build-intel:
    name: Build macos-intel
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply release version from tag
        if: github.ref_type == 'tag'
        shell: bash
        run: python scripts/bump_version.py "${GITHUB_REF_NAME}"

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install .

      - name: Build binary (PyInstaller)
        shell: bash
        run: |
          pyinstaller --onefile --name mdcms --collect-data certifi mdcms.py

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p out/latest/macos/intel out/release
          cp dist/mdcms out/latest/macos/intel/mdcms
          cp dist/mdcms out/release/mdcms-macos-intel
          ls -R out

      - uses: actions/upload-artifact@v4
        with:
          name: intel-macos-dist
          path: out
          if-no-files-found: error

  publish:
    name: Publish to latest/ and release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Apply the same version bump to main so the committed source (and the
      # next `pip install mdcms` / template download) matches the released tag.
      # Note: mdcms.py on main may already carry this version — the versioning
      # rule in CLAUDE.md has it bumped in the commit that merges to main, so
      # this is frequently a no-op by the time this workflow runs.
      - name: Apply release version from tag
        if: github.ref_type == 'tag'
        shell: bash
        run: python scripts/bump_version.py "${GITHUB_REF_NAME}"

      # docs/banner/v{version}.txt is what `mdcms --version` fetches to show a
      # one-line status message for the running CLI. Rather than diffing
      # mdcms.py's version before/after the bump above (unreliable — it's
      # often already at the new version by this point, see note above), scan
      # every existing banner file: any that still claims to be "the latest
      # version" but isn't this release gets flipped to the outdated message.
      # This is self-healing — it also repairs any banner a past release
      # failed to flip, not just the one being replaced right now.
      - name: Update version banners
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          NEW_VERSION=$(python -c "import re;print(re.search(r'CLI_VERSION = \"([^\"]+)\"', open('mdcms.py').read()).group(1))")
          NEW_DATE=$(python -c "import re;print(re.search(r'CLI_RELEASE_DATE = \"([^\"]+)\"', open('mdcms.py').read()).group(1))")
          mkdir -p docs/banner
          for f in docs/banner/v*.txt; do
            [ -e "$f" ] || continue
            base="$(basename "$f" .txt)"
            if [ "$base" != "v${NEW_VERSION}" ] && grep -qi "latest version" "$f"; then
              echo "This version is outdated. Please run mdcms upgrade or visit github.com/kbenestad/mdcms for more information." > "$f"
            fi
          done
          echo "This is the latest version (${NEW_DATE})." > "docs/banner/v${NEW_VERSION}.txt"

      # app/mdcms.json is the manifest `mdcms register` downloads the starter
      # template by, straight off main — so it must list exactly the files that
      # are in app/. It is a checked-in static list, so it goes stale as soon as
      # a template file is added or removed, and a stale entry 404s mid-download
      # (this is how the trimmed icon pack broke `register` before v0.8.3).
      # Regenerating it from the actual tree at every release keeps it honest
      # without anyone having to remember.
      - name: Refresh app/ template manifest
        shell: bash
        run: |
          python -m pip install --quiet click pyyaml certifi
          python -c "import pathlib, mdcms; mdcms.generate_site_manifest(pathlib.Path('app'))"
          git --no-pager diff --stat -- app/mdcms.json

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dist-*
          merge-multiple: true

      # Refresh everything except macos/intel — that binary is published by the
      # separate publish-intel job, and the previously released one must survive
      # this refresh so its download URL keeps working in the meantime.
      - name: Update latest/ tree
        shell: bash
        run: |
          mkdir -p latest
          rsync -a --delete --exclude '/macos/intel/' artifacts/latest/ latest/
          echo "latest/ now contains:"
          find latest -type f | sort

      - name: Commit binaries to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest mdcms.py pyproject.toml app/config.yml app/index.html app/mdcms.json docs/banner
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            MSG="Update latest/ binaries"
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              MSG="Release ${GITHUB_REF_NAME}: bump version and update latest/ binaries"
            fi
            git commit -m "$MSG"
            git push origin HEAD:main
          fi

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          PRERELEASE=""
          case "${GITHUB_REF_NAME}" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          # A release for this tag can already exist (e.g. someone drafted it by
          # hand on GitHub, which also creates the tag and triggers this run) —
          # `gh release create` errors out in that case instead of updating it.
          # Fall back to uploading the built assets onto the existing release.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; uploading assets to it instead of creating a new one."
            gh release upload "${GITHUB_REF_NAME}" artifacts/release/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              $PRERELEASE \
              artifacts/release/*
          fi

  # Runs after both build-intel and publish, so it lands on the main that
  # publish just pushed and (on tags) uploads into the release publish created.
  publish-intel:
    name: Publish macos-intel to latest/ and release
    needs: [build-intel, publish]
    if: ${{ !cancelled() && needs.build-intel.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download Intel build artifact
        uses: actions/download-artifact@v4
        with:
          name: intel-macos-dist
          path: artifacts

      - name: Commit Intel binary to main
        shell: bash
        run: |
          mkdir -p latest/macos/intel
          cp artifacts/latest/macos/intel/mdcms latest/macos/intel/mdcms
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest/macos/intel
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            MSG="Update latest/ macos-intel binary"
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              MSG="Release ${GITHUB_REF_NAME}: update latest/ macos-intel binary"
            fi
            git commit -m "$MSG"
            git push origin HEAD:main
          fi

      - name: Attach Intel binary to GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${GITHUB_REF_NAME}" artifacts/release/mdcms-macos-intel --clobber
