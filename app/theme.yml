# mdcms theme v0.6.0
# MD-CMS — Theme configuration
#
# Colours are declared as a neutral `palette:` with a `light:` and a `dark:`
# block. Both blocks use the same fixed token names; only the values differ.
# Each token maps to one or more features (see the reference docs).

# ──────────────────────────────────
# Colour palette
# ──────────────────────────────────
palette:
  light:
    primary: "#2563EB"      # brand colour — headings, content links, active nav, tab underline
    surface: "#F8FAFC"      # nav / panel background
    page: "#FFFFFF"         # page background
    ink: "#1E293B"          # body text
    ink-muted: "#64748B"    # secondary / muted text
    # ── Nav-on-surface (optional) ──────────────────────────────
    # Only needed when `surface` is a strong/dark colour and the defaults
    # (which derive from ink / primary) would be illegible on it. Set all six
    # together. Omit the whole group for a light, subtle nav.
    # on-surface: "#1E293B"         # inactive nav link text
    # on-surface-active: "#2563EB"  # active nav link text
    # on-surface-title: "#1E293B"   # site name in the nav header
    # on-surface-heading: "#64748B" # nav section-heading labels
    # on-surface-note: "#64748B"    # site description under the title
    # on-surface-icon: "#64748B"    # dark/light toggle
    # divider: "#CBD5E1"            # borders / rules (defaults to a mix of page + ink)

  dark:
    primary: "#60A5FA"
    surface: "#1E293B"
    page: "#0F172A"
    ink: "#F1F5F9"
    ink-muted: "#94A3B8"
    # on-surface: "#E2E8F0"
    # on-surface-active: "#60A5FA"
    # on-surface-title: "#E2E8F0"
    # on-surface-heading: "#94A3B8"
    # on-surface-note: "#94A3B8"
    # on-surface-icon: "#94A3B8"
    # divider: "#334155"

# ──────────────────────────────────
# Semantic colours
# Used by callout tags (info, warning, success, error).
# colours-semantic applies to both modes; colours-semantic-dark overrides for dark mode.
# ──────────────────────────────────
colours-semantic:
  info: "#2563EB"
  warning: "#D97706"
  success: "#16A34A"
  error: "#DC2626"

colours-semantic-dark:
  info: "#60A5FA"
  warning: "#F59E0B"
  success: "#34D399"
  error: "#F87171"

# ──────────────────────────────────
# Callout defaults
# ──────────────────────────────────
callouts:
  info:
    icon: info
    primary-colour: "#2563EB"
    background-colour: "#2563EB"
  warning:
    icon: warning
    primary-colour: "#D97706"
    background-colour: "#D97706"
  success:
    icon: success
    primary-colour: "#16A34A"
    background-colour: "#16A34A"
  error:
    icon: error
    primary-colour: "#DC2626"
    background-colour: "#DC2626"

# ──────────────────────────────────
# Typography
# Format: "provider:Font Name:weight"  (provider: bunny | google)
# ──────────────────────────────────
font-body: "bunny:Noto Sans:400"
font-heading: "bunny:Noto Sans:700"
font-size: 1.0        # unitless multiplier (1.0 = 16px base)
line-height: 1.7      # unitless multiplier

# ──────────────────────────────────
# Nav section toggle icons
# Used on sections with pagesvisibility: hidden (collapsible sections).
# expand-icon shown when section is collapsed; collapse-icon when expanded.
# Options: arrow_right/arrow_drop_down (default) | keyboard_arrow_right/keyboard_arrow_down
#          keyboard_double_arrow_right/keyboard_double_arrow_down
#          expand_content/collapse_content | add/minimize
# ──────────────────────────────────
# nav-section-expand-icon: arrow_right
# nav-section-collapse-icon: arrow_drop_down

# ──────────────────────────────────
# Layout
# ──────────────────────────────────
main-width: 80em
nav-width: 20em
